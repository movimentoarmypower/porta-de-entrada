<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var API="https://script.google.com/macros/s/AKfycbz726zGhy4aDOOMWJHMOYh6h6QKpm6svEQFk9RxIBrjuYhoY9C9MvgqZopIOnhF3nWu/exec";function chamar(fn,args,ok,falha){fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args}),redirect:"follow"}).then(function(r){return r.json();}).then(function(j){if(j&&j.__erro!==undefined){if(falha)falha(new Error(j.__erro));}else if(ok){ok(j?j.r:null);}}).catch(function(){if(falha)falha(new Error("Sem conexão no momento. Confira a internet e tente de novo."));});}function criar(ok,falha){return new Proxy({},{get:function(t,k){if(k==="withSuccessHandler")return function(f){return criar(f,falha);};if(k==="withFailureHandler")return function(f){return criar(ok,f);};if(k==="withUserObject")return function(){return criar(ok,falha);};return function(){chamar(k,[].slice.call(arguments),ok,falha);};}});}window.google=window.google||{};window.google.script={run:criar(null,null)};})();</script>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAP OS | Portal Central</title>
  <style>
    :root{--roxo-escuro:#401443;--roxo:#702477;--magenta:#a12ba4;--fundo:#f7f5f8;--texto:#26152e;--texto-suave:#776b7d;--borda:#e9e0ec;--branco:#fff;--verde:#17806a;--amarelo:#b7791f;--vermelho:#b42318;--azul:#36c3c7}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--texto);background:var(--fundo)}
    button,input,select,textarea{font:inherit}
    a{color:var(--roxo)}
    .layout{min-height:100vh;display:flex}
    .sidebar{width:245px;flex-shrink:0;background:var(--roxo-escuro);color:#fff;padding:24px 15px;display:flex;flex-direction:column;gap:22px}
    .marca{display:flex;align-items:center;gap:11px;padding:0 3px}
    .marca-icone{width:42px;height:42px;border-radius:12px;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:bold}
    .marca b{display:block;font-size:17px}.marca small{opacity:.75;font-size:12px}
    .menu{display:flex;flex-direction:column;gap:4px}
    .menu button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;opacity:.85}
    .menu button:hover,.menu button.ativo{background:rgba(255,255,255,.12);opacity:1}
    .menu .sub{padding-left:24px;font-size:14px}
    .quem{margin-top:auto;font-size:13px;opacity:.85;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
    .quem button{margin-top:8px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
    main{flex:1;padding:28px 34px;min-width:0}
    h1{margin:0 0 4px;font-size:26px;color:var(--roxo-escuro)}
    h2{font-size:19px;color:var(--roxo-escuro);margin:0 0 12px}
    .sub-tit{color:var(--texto-suave);margin:0 0 22px}
    .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
    .card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:18px}
    .modulo{cursor:pointer;transition:.15s}.modulo:hover{border-color:var(--magenta);transform:translateY(-2px)}
    .modulo h3{margin:6px 0;font-size:16px;color:var(--roxo-escuro)}
    .modulo p{margin:0;color:var(--texto-suave);font-size:14px;line-height:1.4}
    .selo{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:#f1e7f3;color:var(--roxo)}
    .selo.ok{background:#e3f4ef;color:var(--verde)}.selo.alerta{background:#fdf1dc;color:var(--amarelo)}.selo.ruim{background:#fde7e5;color:var(--vermelho)}
    .secao{margin-bottom:22px}
    .botoes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
    .btn{background:var(--roxo);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
    .btn:hover{background:var(--magenta)}.btn.claro{background:#f1e7f3;color:var(--roxo)}.btn.pq{padding:6px 10px;font-size:13px}
    .btn:disabled{opacity:.5;cursor:default}
    .duas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .tarefa{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--borda)}
    .tarefa:last-child{border:0}.tarefa input{margin-top:3px;width:18px;height:18px}
    .tarefa small{color:var(--texto-suave);display:block}
    label{display:block;font-size:13px;font-weight:bold;margin:10px 0 4px}
    textarea,input[type=text],input[type=email],select{width:100%;border:1px solid var(--borda);border-radius:10px;padding:9px;background:#fff}
    textarea{min-height:70px;resize:vertical}
    .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .num{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:14px}
    .num b{font-size:24px;color:var(--roxo-escuro);display:block}.num span{font-size:13px;color:var(--texto-suave)}
    .tab-wrap{overflow-x:auto;background:#fff;border:1px solid var(--borda);border-radius:14px}
    table{border-collapse:collapse;width:100%;font-size:13px}
    th,td{padding:8px 10px;border-bottom:1px solid var(--borda);text-align:left;vertical-align:top}
    th{background:#f8f2f9;color:var(--roxo-escuro);position:sticky;top:0}
    td select{padding:4px;min-width:120px}
    .msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
    .msg.ok{background:#e3f4ef;color:var(--verde)}.msg.erro{background:#fde7e5;color:var(--vermelho)}
    .vazio{color:var(--texto-suave);font-size:14px;padding:6px 0}
    .carregando{color:var(--texto-suave);padding:30px 0}
    .bola{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e2d9e5}.bola.s{background:var(--verde)}
    .pend{border:1px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
    .pend summary{cursor:pointer;font-weight:bold;color:var(--roxo-escuro)}
    .capa{position:fixed;inset:0;background:linear-gradient(135deg,var(--roxo-escuro),var(--roxo));display:grid;place-items:center;z-index:50;padding:16px}
    .caixa{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:400px}
    .modal{position:fixed;inset:0;background:rgba(38,21,46,.55);display:none;place-items:center;z-index:60;padding:16px}
    .modal .caixa{max-width:620px;max-height:85vh;overflow:auto}
    .modal ul{margin:4px 0 12px;padding-left:20px}
    .oculto{display:none!important}
    @media(max-width:860px){.layout{flex-direction:column}.sidebar{width:100%}.duas{grid-template-columns:1fr}main{padding:20px 16px}}
  </style>
</head>
<body>
  
  <div class="capa" id="capa">
    <div class="caixa">
      <div class="marca" style="color:var(--roxo-escuro);margin-bottom:16px"><div class="marca-icone">MAP</div><div><b>MAP OS</b><small>Gestão e Operações</small></div></div>
      <div id="passo1">
        <label for="lg-email">Seu e-mail de equipe</label>
        <input type="email" id="lg-email" placeholder="seuemail@exemplo.com" autocomplete="email">
        <button class="btn" style="margin-top:12px;width:100%" id="lg-enviar">Receber código</button>
      </div>
      <div id="passo2" class="oculto">
        <label for="lg-cod">Código de 6 dígitos (enviado ao seu e-mail)</label>
        <input type="text" id="lg-cod" inputmode="numeric" maxlength="6" placeholder="000000">
        <button class="btn" style="margin-top:12px;width:100%" id="lg-entrar">Entrar</button>
        <button class="btn claro" style="margin-top:8px;width:100%" id="lg-voltar">Trocar e-mail</button>
      </div>
      <div id="lg-msg"></div>
    </div>
  </div>

  <div class="layout oculto" id="app">
    <aside class="sidebar">
      <div class="marca"><div class="marca-icone">MAP</div><div><b>MAP OS</b><small>Gestão e Operações</small></div></div>
      <nav class="menu" id="menu"></nav>
      <div class="quem"><span id="quem-nome"></span><br><small id="quem-perfil"></small><br><button id="sair">Sair</button></div>
    </aside>
    <main id="conteudo"></main>
  </div>

  <div class="modal" id="modal"><div class="caixa" id="modal-corpo"></div></div>

<script>
  var MODULOS = [{"id":"porta-jod","nome":"Porta JOD — Porta de Entrada","area":true,"categoria":"Setores transversais","status":"Conectado","descricao":"Quem entra no MAP, curadoria das entradas, grupos de Estado, tarefas e relatório semanal da equipe JOD.","url":"https://movimentoarmypower.github.io/porta-de-entrada/"},{"id":"rh-sam","nome":"RH e SAM","area":true,"categoria":"Setores transversais","status":"Conectado","descricao":"Pessoas, voluntariado, atendimento e encaminhamentos: matrículas, pendências, trilhas e relatórios da equipe.","url":"https://movimentoarmypower.github.io/porta-de-entrada/?pagina=vagas"},{"id":"gestao-geral","nome":"Gestão Geral","descricao":"Visão institucional, prioridades, decisões e acompanhamento geral.","categoria":"Governança","status":"Em preparação","url":""},{"id":"conselho","nome":"Conselho","descricao":"Acompanhamento institucional e registros de governança.","categoria":"Governança","status":"Em preparação","url":""},{"id":"marketing","nome":"Marketing e Comunicação","descricao":"Campanhas, conteúdo, comunicação e suporte aos projetos.","categoria":"Setores transversais","status":"Em preparação","url":""},{"id":"juridico","nome":"Jurídico","descricao":"Demandas jurídicas, documentos e acompanhamento de processos.","categoria":"Setores transversais","status":"Em preparação","url":""},{"id":"painel-equipe","nome":"Painel da equipe","painel":true,"categoria":"Acompanhamento","status":"Conectado","descricao":"Quem enviou o relatório semanal, quem fez as tarefas, quem entrou no sistema e quem precisa de ajuda.","url":""},{"id":"tarefas","nome":"Tarefas e Atividades","descricao":"Demandas, responsáveis, prazos, entregas e pendências.","categoria":"Acompanhamento","status":"Planejado","url":""},{"id":"health-army","nome":"Health Army","area":true,"descricao":"Pacientes, sessões, profissionais e contratos, tarefas e relatórios das equipes do Health Army.","categoria":"Frentes e projetos","status":"Conectado","url":""},{"id":"sos-armys","nome":"SOS Armys","area":true,"descricao":"Pedidos de ajuda, curadoria do Acolhe Army, documentos, encaminhamentos, atendimentos e Fundo Emergencial.","categoria":"Frentes e projetos","status":"Conectado","url":""},{"id":"jus-voz","nome":"Sua Voz Importa · Área Técnica","area":true,"descricao":"Mobilização MAP + JusArmy: credenciamento de especialistas, termo de sigilo, demandas técnicas, laudos e dossiê.","categoria":"Frentes e projetos","status":"Conectado","url":""},{"id":"agromap","nome":"AgroMAP","descricao":"Acesso ao portal de gestão do AgroMAP.","categoria":"Frentes e projetos","status":"Em preparação","url":""},{"id":"army-world","nome":"Army World","descricao":"Acesso aos sistemas e às atividades do Army World.","categoria":"Frentes e projetos","status":"Em preparação","url":""},{"id":"suporte","nome":"Ajuda e Suporte","descricao":"Orientações e solicitações de ajuda para o MAP OS.","categoria":"Apoio","status":"Em preparação","url":""}];
  var S = { email: '', token: '', dados: null, area: null };
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function guardar(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function ler(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function chamar(fn, args, ok) {
    var r = google.script.run.withSuccessHandler(function (res) {
      if (res && !res.ok && res.sessao) { sair(); return; }
      ok(res);
    }).withFailureHandler(function (e) { ok({ ok: false, erro: 'Falha de conexão: ' + (e && e.message || e) }); });
    r[fn].apply(r, args);
  }
  function aviso(el, tipo, txt) { el.innerHTML = '<div class="msg ' + tipo + '">' + esc(txt) + '</div>'; }

   
  $('lg-enviar').onclick = function () {
    var b = this; b.disabled = true; $('lg-msg').innerHTML = '';
    chamar('centralEnviarCodigo', [$('lg-email').value], function (r) {
      b.disabled = false;
      if (!r.ok) return aviso($('lg-msg'), 'erro', r.erro);
      aviso($('lg-msg'), 'ok', r.mensagem); $('passo1').classList.add('oculto'); $('passo2').classList.remove('oculto'); $('lg-cod').focus();
    });
  };
  $('lg-voltar').onclick = function () { $('passo2').classList.add('oculto'); $('passo1').classList.remove('oculto'); $('lg-msg').innerHTML = ''; };
  $('lg-entrar').onclick = function () {
    var b = this; b.disabled = true;
    chamar('centralEntrar', [$('lg-email').value, $('lg-cod').value], function (r) {
      b.disabled = false;
      if (!r.ok) return aviso($('lg-msg'), 'erro', r.erro);
      S.email = r.email; S.token = r.token; guardar('mapos_email', r.email); guardar('mapos_token', r.token); iniciar(r);
    });
  };
  $('lg-cod').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('lg-entrar').click(); });
  $('lg-email').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('lg-enviar').click(); });
  function sair() { guardar('mapos_email', ''); guardar('mapos_token', ''); S.token = ''; $('app').classList.add('oculto'); $('capa').classList.remove('oculto'); $('passo2').classList.add('oculto'); $('passo1').classList.remove('oculto'); }
  $('sair').onclick = sair;

  (function () {
    S.email = ler('mapos_email'); S.token = ler('mapos_token');
    if (!S.email || !S.token) return;
    $('lg-email').value = S.email;
    aviso($('lg-msg'), 'ok', 'Abrindo sua Central...');
    chamar('centralAbrir', [S.email, S.token], function (r) { if (r.ok) iniciar(r); else { $('lg-msg').innerHTML = ''; } });
  })();

   
  var CATS = ['Governança', 'Setores transversais', 'Frentes e projetos', 'Acompanhamento', 'Apoio'];
  function iniciar(r) {
    S.dados = r;
    $('capa').classList.add('oculto'); $('app').classList.remove('oculto');
    $('quem-nome').textContent = r.pessoa.nome + (r.pessoa.mat ? ' · ' + r.pessoa.mat : '');
    $('quem-perfil').textContent = r.gestao ? 'Gestão Geral' : (r.perfis.join(', ') || 'Equipe');
    var m = '<button data-v="inicio" class="ativo">Visão geral</button>' + (r.areas.indexOf('trilha') >= 0 ? '<button data-v="area:trilha">Minha trilha de integração</button>' : '') + '<button data-v="avisos">Mural de avisos</button>';
    CATS.forEach(function (c) { m += '<button data-v="cat:' + esc(c) + '">' + esc(c) + '</button>';
      if (c === 'Setores transversais') r.areas.forEach(function (a) { var mod = modulo(a); if (mod && a !== 'health-army' && a !== 'sos-armys' && a !== 'jus-voz') m += '<button class="sub" data-v="area:' + a + '">' + esc(mod.nome) + '</button>'; });
      if (c === 'Acompanhamento' && r.painel) m += '<button class="sub" data-v="painel">Painel da equipe</button>';
      if (c === 'Acompanhamento') m += '<button class="sub" data-v="planejamento">Planejamento anual</button>';
      if (c === 'Acompanhamento') m += '<button class="sub" data-v="reunioes">Reuniões com a Gestão</button>';
      if (c === 'Acompanhamento' && !(r.gestao || r.areas.indexOf('rh-sam') >= 0)) m += '<button class="sub" data-v="solicitacoes">Solicitações da minha equipe</button><button class="sub" data-v="presenca">Presença da minha equipe</button>';
      if (c === 'Frentes e projetos' && r.areas.indexOf('health-army') >= 0) m += '<button class="sub" data-v="area:health-army">Health Army</button>';
      if (c === 'Frentes e projetos' && r.areas.indexOf('sos-armys') >= 0) m += '<button class="sub" data-v="area:sos-armys">SOS Armys</button>';
      if (c === 'Frentes e projetos' && r.areas.indexOf('jus-voz') >= 0) m += '<button class="sub" data-v="area:jus-voz">Sua Voz Importa</button>';
    });
    m += '<button data-v="guia">Como usar o MAP OS</button>';
    $('menu').innerHTML = m;
    $('menu').querySelectorAll('button').forEach(function (b) { b.onclick = function () { ir(b.getAttribute('data-v')); }; });
    ir(r.areas.length === 1 && !r.gestao ? 'area:' + r.areas[0] : 'inicio');
    if (r.areas.length === 1 && !r.gestao) avisosHome();
  }
  function modulo(id) { return MODULOS.filter(function (m) { return m.id === id; })[0]; }
  function ir(v) {
    $('menu').querySelectorAll('button').forEach(function (b) { b.classList.toggle('ativo', b.getAttribute('data-v') === v); });
    window.scrollTo(0, 0);
    if (v === 'inicio') return telaInicio();
    if (v.indexOf('cat:') === 0) return telaCategoria(v.slice(4));
    if (v === 'area:health-army') { window.MKTX = null; return telaHA(); }
    if (v === 'area:sos-armys') return telaSOS();
    if (v === 'area:jus-voz') return telaVoz();
    if (v === 'area:trilha') return onbMinhaTela();
    if (v.indexOf('area:') === 0) return telaArea(v.slice(5));
    if (v === 'painel') return telaPainel();
    if (v === 'planejamento') { PL.aberto = ''; return telaPlanejamento(); }
    if (v === 'reunioes') { RE.slot = ''; RE.dia = ''; return telaReunioes(); }
    if (v === 'solicitacoes') return telaSolicitacoes('');
    if (v === 'presenca') return telaPresenca('');
    if (v === 'avisos') return telaAvisos();
    if (v === 'guia' || v.indexOf('guia:') === 0) return telaGuia(v.split(':')[1] || '');
  }
  function cardModulo(m) {
    var pode = (m.area && S.dados.areas.indexOf(m.id) >= 0) || (m.painel && S.dados.painel) || (!m.area && !m.painel && m.url);
    var cls = m.status === 'Conectado' ? 'ok' : (m.status === 'Em preparação' ? 'alerta' : '');
    return '<div class="card modulo" data-id="' + m.id + '"><span class="selo ' + cls + '">' + esc(m.status) + '</span><h3>' + esc(m.nome) + '</h3><p>' + esc(m.descricao) + '</p>' +
      (pode ? '' : (m.area || m.painel ? '<p style="margin-top:8px;font-size:12px">Acesso restrito à equipe da área.</p>' : '')) + '</div>';
  }
  function ligarCards() {
    document.querySelectorAll('.modulo').forEach(function (c) { c.onclick = function () {
      var m = modulo(c.getAttribute('data-id'));
      if (m.area && S.dados.areas.indexOf(m.id) >= 0) return ir('area:' + m.id);
      if (m.painel && S.dados.painel) return ir('painel');
      if (!m.area && !m.painel && m.url) return window.open(m.url, '_blank');
      alert(m.area || m.painel ? 'Esta área é restrita à equipe responsável.' : 'Este módulo ainda está em preparação.');
    }; });
  }
  function telaInicio() {
    var d = S.dados, h = '<h1>Olá, ' + esc(d.pessoa.curto) + '</h1><p class="sub-tit">Central de Gestão do ' + esc("Movimento Army Power") + '.</p>';
    var minhas = MODULOS.filter(function (m) { return (m.area && d.areas.indexOf(m.id) >= 0) || (m.painel && d.painel); });
    if (minhas.length) h += '<div class="secao"><h2>Suas áreas</h2><div class="grade">' + minhas.map(cardModulo).join('') + '</div></div>';
    if (d.gestao) h += '<div class="secao"><h2>Todos os módulos</h2><div class="grade">' + MODULOS.filter(function (m) { return minhas.indexOf(m) < 0; }).map(cardModulo).join('') + '</div></div>';
    $('conteudo').innerHTML = h; ligarCards(); avisosHome();
  }
  function telaCategoria(c) {
    var l = MODULOS.filter(function (m) { return m.categoria === c; });
    $('conteudo').innerHTML = '<h1>' + esc(c) + '</h1><p class="sub-tit">Módulos desta parte do MAP OS.</p><div class="grade">' + (l.map(cardModulo).join('') || '<p class="vazio">Nada aqui ainda.</p>') + '</div>';
    ligarCards();
  }

   
  function telaArea(area) {
    S.area = area;
    $('conteudo').innerHTML = '<p class="carregando">Carregando a área...</p>';
    chamar('centralArea', [S.email, S.token, area], function (r) {
      if (!r.ok) { $('conteudo').innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      var L = S.dados.links, h = '<h1>' + esc(r.nome) + '</h1><p class="sub-tit">Semana ' + esc(r.semana) + '</p><div class="botoes">';
      if (area === 'porta-jod') {
        if (L.entradas) h += '<a class="btn" target="_blank" href="' + esc(L.entradas) + '">Abrir a aba Entradas_JOD na planilha</a>';
        h += '<a class="btn claro" target="_blank" href="' + esc(L.jod) + '">Abrir a Porta de Entrada</a>';
      } else {
        h += '<a class="btn" target="_blank" href="' + esc(L.consulta) + '">Pesquisar matrículas (equipe, membros e parceiros)</a>';
        h += '<a class="btn claro" target="_blank" href="' + esc(L.vagas) + '">Vagas e voluntariado</a>';
      }
      h += '<button class="btn claro" onclick="ir(\'guia:' + area + '\')">Como usar esta área</button>';
      h += '</div>';
      var semana = '<div class="duas secao"><div class="card"><h2>Tarefas da semana</h2>' + listaTarefas(r) + '</div>' +
        '<div class="card"><h2>Relatório semanal</h2>' + formRelatorio(r) + '</div></div><div id="tar-ger"></div>';

  function telaPainel() {

<script>
   
  var HA = { d: null, aba: 'pacientes' };
  function haArq(input) {

      var f = input && input.files && input.files[0];

      if (f.size > 15 * 1024 * 1024) return erro(new Error('Arquivo maior que 15 MB.'));
      var r = new FileReader();
      r.onload = function () { ok({ nome: f.name, tipo: f.type || 'application/octet-stream', b64: String(r.result).split(',')[1] }); };
      r.onerror = function () { erro(new Error('Não consegui ler o arquivo.')); };
      r.readAsDataURL(f);
    });
  }
  function haOpc(l, atual, vazio) { return (vazio ? '<option value="">' + esc(vazio) + '</option>' : '') + l.map(function (o) { return '<option' + (o === atual ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }

  function telaHA(aba) {

    d.pacientes.forEach(function (p) { var g = por[p.projeto] = por[p.projeto] || { at: 0, ag: 0, alta: 0, faltas: 0, sess: 0, prof: 0, venc: 0 };
      if (p.situacao === 'Em atendimento') g.at++; else if (p.situacao === 'Aguardando início') g.ag++; else if (p.situacao === 'Alta') g.alta++;

<script>

  function haEventos() {

        '<label>Nome *</label><input type="text" id="he-nome"><label>Projeto *</label><select id="he-proj">' + haOpc(haProjsTodos(), '', 'Escolha') + '</select>' +
        '<label>Tipo</label><select id="he-tipo">' + haOpc(L.eventoTipo, 'Evento') + '</select><label>Formato</label><select id="he-formato">' + haOpc(L.formato, 'Online') + '</select>' +
        '<label>Local ou plataforma</label><input type="text" id="he-local"></div><div>' +
        '<label>Data de início *</label><input type="date" id="he-ini"><label>Data de fim</label><input type="date" id="he-fim">' +
        '<label>Meta de público</label><input type="text" id="he-meta"><label>Link de inscrição</label><input type="text" id="he-link">' +
        '<label>Responsável (e-mail)</label><input type="email" id="he-resp" placeholder="deixe vazio para você"></div></div>' +
        '<label>Necessidades (equipe, materiais, parceiros, divulgação)</label><textarea id="he-nec"></textarea>' +
        '<label style="font-weight:normal"><input type="checkbox" id="he-div" checked> Pedir divulgação ao Marketing (cria a pauta automaticamente)</label>' +

      var st = e.edita ? '<select data-hes="' + esc(e.id) + '">' + haOpc(L.eventoStatus, e.status) + '</select>' : esc(e.status);
      var num = function (campo, v) { return e.edita ? '<input type="text" data-hen="' + esc(e.id) + '" data-campo="' + campo + '" value="' + esc(v) + '" style="width:60px;padding:4px">' : esc(v); };
      return '<tr><td><b>' + esc(e.id) + '</b></td><td>' + esc(e.nome) + '<br><small>' + esc(e.tipo + ' · ' + e.formato + (e.local ? ' · ' + e.local : '')) + '</small></td><td>' + esc(e.projeto) + '</td>' +
        '<td>' + haDataBR(e.inicio) + (e.fim && e.fim !== e.inicio ? ' a ' + haDataBR(e.fim) : '') + '</td><td>' + st + '</td><td>' + esc(e.meta) + '</td><td>' + num('inscritos', e.inscritos) + '</td><td>' + num('participantes', e.participantes) + '</td>' +
        '<td>' + (e.link ? '<a target="_blank" href="' + esc(e.link) + '">Inscrição</a>' : '—') + '</td><td>' + (e.pauta ? esc(e.pauta) : (e.edita ? '<button class="btn pq claro" data-hepauta="' + esc(e.id) + '">Pedir divulgação</button>' : '—')) + '</td>' +

    h += '<h2 style="margin-top:14px">Próximos e em andamento (' + prox.length + ')</h2>' + haTab(cab, prox.map(linha), 'Nada agendado.');
    h += '<h2 style="margin-top:18px">Concluídos e anteriores</h2>' + haTab(cab, pass.slice(0, 40).map(linha), 'Nada ainda.');

    if (b) b.onclick = function () {
      b.disabled = true;

    document.querySelectorAll('[data-hepauta]').forEach(function (bt) { bt.onclick = function () {
      var e = x.eventos.filter(function (v) { return v.id === bt.getAttribute('data-hepauta'); })[0]; bt.disabled = true;

        if (!r.ok) { bt.disabled = false; return alert(r.erro); }

  function haPautas() {

      '<div class="num"><b>' + (cont['Publicada'] || 0) + '</b><span>publicadas</span></div><div class="num"><b>' + ms + '</b><span>articulações com o MAPStream em aberto</span></div></div>';

      h += '<details class="pend"><summary>Nova pauta</summary><div class="duas" style="margin-top:10px"><div>' +
        '<label>Pauta / tema *</label><input type="text" id="hm-pauta" maxlength="300"><label>Projeto *</label><select id="hm-proj">' + haOpc(haProjsTodos(), '', 'Escolha') + '</select>' +
        '<label>Tipo</label><select id="hm-tipo">' + haOpc(L.pautaTipo, 'Post') + '</select></div><div>' +
        '<label>Canal</label><select id="hm-canal">' + haOpc(L.pautaCanal, 'Instagram') + '</select><label>Data prevista</label><input type="date" id="hm-data">' +
        '<label>MAPStream</label><select id="hm-ms">' + haOpc(L.mapstream, 'Não envolve') + '</select></div></div>' +
        '<label>Informações a validar / observação</label><textarea id="hm-obs"></textarea>' +
        '<button class="btn" id="hm-salvar" style="margin-top:8px">Registrar pauta</button><div id="hm-msg"></div></details>';
    }
    
    var grupos = {};
    x.pautas.filter(function (p) { return p.status !== 'Cancelada'; }).forEach(function (p) {
      var k = p.data ? p.data.slice(0, 7) : 'sem-data'; (grupos[k] = grupos[k] || []).push(p); });
    h += '<input type="text" id="hm-filtro" placeholder="Filtrar por projeto, tema, status..." style="margin:12px 0;max-width:360px">';
    var chaves = Object.keys(grupos).sort();
    if (!chaves.length) h += '<p class="vazio">Nenhuma pauta ainda.</p>';
    chaves.forEach(function (k) {
      var tit = k === 'sem-data' ? 'Sem data definida' : HA_MESES[Number(k.slice(5, 7)) - 1] + ' de ' + k.slice(0, 4);
      h += '<h2 style="margin-top:16px">' + tit + '</h2>' + haTab(['Data', 'ID', 'Pauta', 'Projeto', 'Tipo / canal', 'Validação', 'Status', 'MAPStream', 'Material'],
        grupos[k].map(function (p) {
          var sel = function (campo, lista, v) { return p.edita ? '<select data-hmp="' + esc(p.id) + '" data-campo="' + campo + '">' + haOpc(lista, v) + '</select>' : esc(v); };
          var link = p.edita ? '<input type="text" data-hmp="' + esc(p.id) + '" data-campo="link" value="' + esc(p.link) + '" placeholder="cole o link" style="width:140px;padding:4px">' : (p.link ? '<a target="_blank" href="' + esc(p.link) + '">Abrir</a>' : '—');
          return '<tr><td>' + haDataBR(p.data) + '</td><td>' + esc(p.id) + (p.evento ? '<br><small>' + esc(p.evento) + '</small>' : '') + '</td><td>' + esc(p.pauta) + (p.obs ? '<br><small>' + esc(p.obs) + '</small>' : '') + '</td><td>' + esc(p.projeto) + '</td>' +
            '<td>' + esc(p.tipo) + '<br><small>' + esc(p.canal) + '</small></td><td>' + sel('validacao', L.validacao, p.validacao) + '</td><td>' + sel('status', L.pautaStatus, p.status) + '</td><td>' + sel('mapstream', L.mapstream, p.mapstream) + '</td><td>' + link + '</td></tr>';
        }), '');
    });
    $('ha-corpo').innerHTML = h;
    var b = $('hm-salvar');
    if (b) b.onclick = function () {
      b.disabled = true;
      chamar('haPautaSalvar', [S.email, S.token, { frente: mktX().frente, pauta: $('hm-pauta').value, projeto: $('hm-proj').value, tipo: $('hm-tipo').value, canal: $('hm-canal').value,
        data: $('hm-data').value, mapstream: $('hm-ms').value, obs: $('hm-obs').value }], function (r) {
        b.disabled = false; if (!r.ok) return aviso($('hm-msg'), 'erro', r.erro); mktX().recarregar('pautas'); });
    };
    $('hm-filtro').oninput = function () { var q = this.value.toLowerCase(); document.querySelectorAll('#ha-corpo tbody tr').forEach(function (tr) { tr.style.display = tr.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none'; }); };
    document.querySelectorAll('[data-hmp]').forEach(function (s) { s.onchange = function () {
      var o = { frente: mktX().frente, id: s.getAttribute('data-hmp') }; o[s.getAttribute('data-campo')] = s.value; s.disabled = true;
      chamar('haPautaSalvar', [S.email, S.token, o], function (r) { s.disabled = false; if (!r.ok) alert(r.erro); });
    }; });
  }

  function telaGuia(foco) {
    var d = S.dados || {};
    var temHA = (d.areas || []).indexOf('health-army') >= 0;
    var mostra = function (g) {
      if (g.para === 'todos') return true;
      if (g.para === 'gestao') return !!d.gestao;
      if (g.para === 'painel') return !!d.painel;
      if (g.para === 'ha-geral') return temHA && !!d.gestao;
      return (d.areas || []).indexOf(g.para) >= 0 || !!d.gestao;
    };
    var abrir = function (g) { return foco ? g.id === foco : g.id === 'entrar'; };
    var lista = GUIA.filter(mostra);
    var h = '<h1>Como usar o MAP OS</h1><p class="sub-tit">Guia rápido. Clique em cada tema para abrir.</p>' +
      '<input type="text" id="guia-busca" placeholder="Procurar no guia (ex.: código, prontuário, tarefa)..." style="margin-bottom:14px;max-width:420px">';
    h += lista.map(function (g) {
      return '<details class="pend" data-guia="' + g.id + '"' + (abrir(g) ? ' open' : '') + '><summary>' + esc(g.titulo) + '</summary><ol style="margin:10px 0 4px;padding-left:20px;line-height:1.55">' +
        g.texto.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol></details>';
    }).join('');
    $('conteudo').innerHTML = h;
    var alvo = document.querySelector('[data-guia][open]');
    if (alvo && foco) alvo.scrollIntoView({ block: 'start' });
    $('guia-busca').oninput = function () {
      var q = this.value.toLowerCase().trim();
      document.querySelectorAll('[data-guia]').forEach(function (el) {
        var tem = !q || el.textContent.toLowerCase().indexOf(q) >= 0;
        el.style.display = tem ? '' : 'none'; if (q && tem) el.open = true;
      });
    };
  }
</script>
<style>

<script>
   
  var AV = { d: null };
  function avContador(n) {
    var b = document.querySelector('[data-v="avisos"]');
    if (!b) return;
    var c = b.querySelector('.contador');
    if (!n) { if (c) c.remove(); return; }
    if (!c) { c = document.createElement('span'); c.className = 'contador'; b.appendChild(c); }
    c.textContent = n;
  }
  function avCartao(a, curto) {
    var sel = a.prioridade === 'Urgente' ? 'ruim' : (a.prioridade === 'Importante' ? 'alerta' : '');
    var h = '<div class="aviso ' + esc(a.prioridade) + (a.lido ? ' lido' : '') + (a.ativo ? '' : ' arquivado') + '"><span class="selo ' + sel + '">' + esc(a.prioridade) + '</span>' +
      (a.ativo ? '' : ' <span class="selo">Fora do mural</span>') + (a.lido ? ' <span class="selo ok">Lido</span>' : '') +
      '<h3>' + esc(a.titulo) + '</h3><div class="meta">' + esc(a.autor) + ' · ' + esc(a.data) + (a.validade ? ' · vale até ' + esc(a.validade) : '') + '</div>';
    if (!curto) h += '<div class="meta">Para: ' + esc(a.publico) + ' · Alcance: ' + esc(a.alcance) + '</div>';
    h += '<div class="texto">' + esc(curto && a.mensagem.length > 220 ? a.mensagem.slice(0, 220) + '...' : a.mensagem) + '</div><div class="botoes" style="margin:0">';
    if (!a.lido && a.ativo) h += '<button class="btn pq" data-avlido="' + esc(a.id) + '">Marcar como lido</button>';
    if (curto) h += '<button class="btn pq claro" onclick="ir(\'avisos\')">Ver no mural</button>';
    if (!curto && a.gerencia) {
      h += '<button class="btn pq claro" data-avleit="' + esc(a.id) + '">Quem leu (' + a.leituras + ')</button>';
      h += '<button class="btn pq claro" data-avsit="' + esc(a.id) + '" data-sit="' + (a.ativo ? 'Arquivado' : 'Ativo') + '">' + (a.ativo ? 'Tirar do mural' : 'Voltar ao mural') + '</button>';
    }
    return h + '</div></div>';
  }
  function avLigar(depois) {
    document.querySelectorAll('[data-avlido]').forEach(function (b) { b.onclick = function () { b.disabled = true; chamar('avLido', [S.email, S.token, b.getAttribute('data-avlido')], function () { depois(); }); }; });
    document.querySelectorAll('[data-avsit]').forEach(function (b) { b.onclick = function () { b.disabled = true; chamar('avSituacao', [S.email, S.token, b.getAttribute('data-avsit'), b.getAttribute('data-sit')], function (r) { if (!r.ok) alert(r.erro); depois(); }); }; });
    document.querySelectorAll('[data-avleit]').forEach(function (b) { b.onclick = function () {
      $('modal').style.display = 'grid'; $('modal-corpo').innerHTML = '<p class="carregando">Carregando...</p>';
      chamar('avLeitores', [S.email, S.token, b.getAttribute('data-avleit')], function (r) {
        $('modal-corpo').innerHTML = '<h2>Quem leu</h2>' + (r.ok ? (r.leitores.length ? '<ul>' + r.leitores.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p class="vazio">Ninguém marcou como lido ainda.</p>') : '<div class="msg erro">' + esc(r.erro) + '</div>') +
          '<button class="btn" onclick="$(\'modal\').style.display=\'none\'">Fechar</button>';
      });
    }; });
  }

  
  function avisosHome() {
    chamar('avAbrir', [S.email, S.token], function (r) {
      if (!r.ok) return;
      AV.d = r; avContador(r.naoLidos);
      var pend = r.avisos.filter(function (a) { return a.ativo && !a.lido; }).slice(0, 3);
      var alvo = document.querySelector('#conteudo .sub-tit');
      if (!alvo || !pend.length || document.getElementById('avisos-home')) return;
      alvo.insertAdjacentHTML('afterend', '<div id="avisos-home" class="secao"><h2>Avisos novos (' + r.naoLidos + ')</h2>' + pend.map(function (a) { return avCartao(a, true); }).join('') + '</div>');
      avLigar(function () { var el = $('avisos-home'); if (el) el.remove(); avisosHome(); });
    });
  }

  function telaAvisos() {
    $('conteudo').innerHTML = '<p class="carregando">Carregando o mural...</p>';
    chamar('avAbrir', [S.email, S.token], function (r) {
      if (!r.ok) { $('conteudo').innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      AV.d = r; avContador(r.naoLidos);
      var h = '<h1>Mural de avisos</h1><p class="sub-tit">Informações importantes para as equipes. Cada pessoa vê só os avisos da sua função e da sua área.</p>' +
        '<div class="botoes"><button class="btn claro" onclick="ir(\'guia:avisos\')">Como usar</button></div>';
      if (r.pode) {
        h += '<details class="pend"><summary>Publicar aviso</summary><div class="duas" style="margin-top:10px"><div>' +
          '<label>Título *</label><input type="text" id="av-titulo" maxlength="150"><label>Mensagem *</label><textarea id="av-msg" style="min-height:120px"></textarea>' +
          '<label>Prioridade</label><select id="av-prio">' + r.prioridades.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') + '</select>' +
          '<label>Vale até (opcional, depois sai do mural sozinho)</label><input type="date" id="av-val"></div><div>' +
          '<label>Alcance (onde o aviso aparece) *</label><select id="av-alc">' + r.publicar.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') + '</select>' +
          '<label>Quem vê *</label><div class="checks">' + r.publicos.map(function (g) { return '<label><input type="checkbox" value="' + g[0] + '" class="av-pub"' + (g[0] === 'todos' ? ' checked' : '') + '> ' + esc(g[1]) + '</label>'; }).join('') + '</div>' +
          '<p style="font-size:12px;color:var(--texto-suave)">A Gestão Geral e o Conselho MAP sempre veem todos os avisos. "Todas as pessoas" dentro de um alcance = todas as pessoas daquela área ou projeto.</p></div></div>' +
          '<button class="btn" id="av-pub">Publicar</button><div id="av-msgret"></div></details>';
      }
      var ativos = r.avisos.filter(function (a) { return a.ativo; }), fora = r.avisos.filter(function (a) { return !a.ativo; });
      h += '<h2 style="margin-top:16px">No mural (' + ativos.length + ')</h2>' + (ativos.map(function (a) { return avCartao(a, false); }).join('') || '<p class="vazio">Nenhum aviso no momento.</p>');
      if (fora.length) h += '<details class="pend" style="margin-top:14px"><summary>Avisos fora do mural (' + fora.length + ')</summary><div style="margin-top:10px">' + fora.map(function (a) { return avCartao(a, false); }).join('') + '</div></details>';
      $('conteudo').innerHTML = h;
      var b = $('av-pub');
      if (b) b.onclick = function () {
        var pub = [].slice.call(document.querySelectorAll('.av-pub:checked')).map(function (x) { return x.value; });
        b.disabled = true;
        chamar('avPublicar', [S.email, S.token, { titulo: $('av-titulo').value, mensagem: $('av-msg').value, prioridade: $('av-prio').value, validade: $('av-val').value, alcance: $('av-alc').value, publico: pub }], function (x) {
          b.disabled = false; if (!x.ok) return aviso($('av-msgret'), 'erro', x.erro); telaAvisos(); });
      };
      avLigar(telaAvisos);
    });
  }
</script>
<script>
   
  var SOSX = { d: null, aba: 'painel', filtro: 'abertos' };
  function sosChamar(fn, args, ok) { chamar(fn, [S.email, S.token].concat(args), ok); }
  function telaSOS(aba) {
    if (aba) SOSX.aba = aba;
    $('conteudo').innerHTML = '<p class="carregando">Carregando o SOS Armys...</p>';
    sosChamar('sosAbrir', [], function (r) {
      if (!r.ok) { $('conteudo').innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      SOSX.d = r;
      window.MKTX = { d: r, recarregar: telaSOS, frente: 'SOS Armys' };
      sosDesenhar();
    });
  }
  function sosChefia() { return SOSX.d.geral || SOSX.d.assist; }
  function sosTudo() { return SOSX.d.geral || SOSX.d.assist || SOSX.d.acolhe; }
  function sosAbas() {
    var d = SOSX.d, l = [], veAss = sosTudo() || d.coord.length || d.prof.length || d.fin;
    if (sosTudo()) l.push(['painel', 'Visão geral']);
    if (sosChefia()) l.push(['acomp', 'Acompanhamento geral']);

</script>
<script>
   
  var VOZX = { d: null, aba: '' };
  function vozChamar(fn, args, ok) { chamar(fn, [S.email, S.token].concat(args), ok); }
  function telaVoz(aba) {
    if (aba) VOZX.aba = aba;
    $('conteudo').innerHTML = '<p class="carregando">Carregando a Área Técnica...</p>';
    vozChamar('vozAbrir', [], function (r) {
      if (!r.ok) { $('conteudo').innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      VOZX.d = r; vozDesenhar();
    });
  }
  function vozAbas() {
    var d = VOZX.d;
    if (d.equipe) return [['painel', 'Visão geral'], ['cred', 'Credenciamento'], ['materiais', 'Materiais'], ['demandas', 'Demandas e entregas']].concat(d.geral || d.coord ? [['equipe', 'Equipe interna']] : []);
    return [['inicio', 'Área Técnica'], ['demandas', 'Demandas técnicas'], ['materiais', 'Materiais de referência'], ['entregas', 'Enviar e acompanhar entregas']];
  }
  function vozDesenhar() {
    var d = VOZX.d, abas = vozAbas();
    if (!abas.some(function (a) { return a[0] === VOZX.aba; })) VOZX.aba = abas[0][0];
    var papel = d.equipe ? [d.geral ? 'Gestão Geral' : '', d.coord ? 'Coordenação JusArmy' : '', d.juridica ? 'Equipe jurídica' : '', d.apoio ? 'Apoio administrativo' : ''].filter(Boolean).join(' · ') : 'Parceiro(a) técnico(a) credenciado(a)';
    $('conteudo').innerHTML = '<h1>Sua Voz Importa · Área Técnica</h1><p class="sub-tit">Mobilização MAP + JusArmy · ' + esc(papel) + ' · acesso individual, restrito e registrado</p><div class="botoes">' +
      abas.map(function (a) { return '<button class="btn ' + (a[0] === VOZX.aba ? '' : 'claro') + '" data-vozaba="' + a[0] + '">' + a[1] + '</button>'; }).join('') +
      '<button class="btn claro" onclick="ir(\'guia:jus-voz\')">Como usar</button></div><div id="voz-corpo"></div>';
    document.querySelectorAll('[data-vozaba]').forEach(function (b) { b.onclick = function () { VOZX.aba = b.getAttribute('data-vozaba'); vozDesenhar(); }; });
    ({ painel: vozPainel, cred: vozCred, materiais: vozMateriais, demandas: vozDemandas, equipe: vozEquipe, inicio: vozInicio, entregas: vozEntregas })[VOZX.aba]();
  }
  function vozSel(sit) { return /liberado|aprovad|integrad|assinado/i.test(sit) ? 'ok' : (/não aprovado|cancelad|encerrad|ajustes/i.test(sit) ? 'ruim' : 'alerta'); }
  function vozModal(h) { $('modal').style.display = 'grid'; $('modal-corpo').innerHTML = h + '<div id="vz-msg"></div><button class="btn claro" style="margin-top:12px" onclick="$(\'modal\').style.display=\'none\'">Fechar</button>'; }
  function vozDepois(aba, el) { return function (r) { if (!r.ok) return aviso(el || $('vz-msg'), 'erro', r.erro); $('modal').style.display = 'none'; telaVoz(aba); }; }

   
  function vozPainel() {
    var d = VOZX.d, cont = function (f) { return d.creds.filter(f).length; }, rel = d.relatos || {}, au = d.autentique;
    var h = '<div class="card"><h2>Link público do credenciamento</h2><p style="font-size:13px">Divulgue este link para profissionais e pesquisadores. O cadastro não dá acesso a nada interno.</p><input type="text" readonly value="' + esc(d.linkPublico) + '" onclick="this.select()"></div>';
    h += '<div class="nums"><div class="num"><b>' + cont(function (c) { return /recebido|em análise/i.test(c.situacao); }) + '</b><span>cadastros para analisar</span></div>' +
      '<div class="num"><b>' + cont(function (c) { return /aguardando termo|termo enviado/i.test(c.situacao); }) + '</b><span>aguardando termo</span></div>' +
      '<div class="num"><b>' + cont(function (c) { return c.situacao === 'Termo assinado'; }) + '</b><span>termo assinado: liberar acesso</span></div>' +
      '<div class="num"><b>' + cont(function (c) { return c.situacao === 'Acesso liberado'; }) + '</b><span>especialistas ativos</span></div>' +
      '<div class="num"><b>' + d.demandas.filter(function (x) { return ['Enviada', 'Em elaboração', 'Ajustes solicitados'].indexOf(x.situacao) >= 0; }).length + '</b><span>demandas em andamento</span></div>' +
      '<div class="num"><b>' + d.entregas.filter(function (x) { return ['Recebida', 'Em revisão'].indexOf(x.situacao) >= 0; }).length + '</b><span>entregas para revisar</span></div></div>';
    h += '<div class="card"><h2>Assinatura eletrônica (Autentique)</h2>' + (au.chave ? '<p>Conectado' + (au.teste ? ' em <b>modo teste</b> (os documentos não têm validade e são apagados em poucos dias)' : '') + '. Documentos enviados neste mês: <b>' + au.usados + ' de ' + au.limite + '</b> (plano gratuito).</p>' :
      '<p>Sem chave do Autentique: o sistema gera o termo em PDF para você enviar pelo site do Autentique e depois registrar o termo assinado.</p>') +
      (au.modelo ? '' : '<p class="msg erro">O modelo do termo ainda não foi criado (rode prepararVoz).</p>') +
      (d.geral && d.links ? '<div class="botoes"><a class="btn claro" target="_blank" href="' + esc(d.links.planilha) + '">Planilha restrita</a><a class="btn claro" target="_blank" href="' + esc(d.links.pasta) + '">Pasta restrita</a>' + (d.links.modelo ? '<a class="btn claro" target="_blank" href="' + esc(d.links.modelo) + '">Modelo do termo (editar)</a>' : '') + '</div>' : '') + '</div>';
    h += '<h2>Relatos recebidos pela mobilização (números, sem dados pessoais)</h2>' + (rel.erro ? '<p class="msg erro">' + esc(rel.erro) + '</p>' :
      '<div class="nums"><div class="num"><b>' + (rel.total || 0) + '</b><span>relatos</span></div><div class="num"><b>' + (rel.comRegistros || 0) + '</b><span>com registros (fotos, vídeos, documentos)</span></div>' +
        (rel.bArmy && rel.bArmy.ok ? '<div class="num"><b>' + rel.bArmy.linhas + '</b><span>relatos do B-ARMY Unido (' + rel.bArmy.pessoas + ' pessoas; ' + rel.bArmy.emAmbos + ' também no Voz ARMY) · aba "Relatos B-ARMY Unido", atualizada em ' + esc(rel.bArmy.atualizado) + '</span></div>' : '') + '</div>' +
      '<div class="duas"><div>' + haTab(['Data do show', 'Relatos'], (rel.porShow || []).map(function (x) { return '<tr><td>' + esc(x.nome) + '</td><td>' + x.n + '</td></tr>'; }), 'Sem dados.') + '</div>' +
      '<div>' + haTab(['Tema relatado', 'Ocorrências'], (rel.porTema || []).map(function (x) { return '<tr><td>' + esc(x.nome) + '</td><td>' + x.n + '</td></tr>'; }), 'Sem dados.') + '</div></div>');
    $('voz-corpo').innerHTML = h;
  }

   
  function vozCred() {
    var d = VOZX.d;
    var h = '<div class="botoes"><button class="btn claro" id="vz-verif">Verificar assinaturas no Autentique agora</button>' + (d.decide ? ' <button class="btn claro" id="vz-reall">Reenviar o link para todos com acesso</button>' : '') + '</div><div id="vz-vmsg"></div><div id="vz-rmsg"></div>' +
      haTab(['Cadastro', 'Nome', 'Área', 'Registro', 'Colaboração', 'Recebido', 'Situação', ''], d.creds.map(function (c, i) {
        return '<tr><td>' + esc(c.id) + '</td><td>' + esc(c.nome) + '<br><small>' + esc(c.cidade) + '</small></td><td>' + esc(c.area) + '</td><td>' + esc(c.registro || '—') + '</td><td>' + esc(c.colab) + '</td><td>' + esc(c.recebido) + '</td>' +
          '<td><span class="selo ' + vozSel(c.situacao) + '">' + esc(c.situacao) + '</span></td><td><button class="btn pq" data-vzc="' + i + '">Abrir</button>' + (d.decide && c.situacao === 'Acesso liberado' ? ' <button class="btn pq claro" data-vzre="' + esc(c.email) + '">Reenviar link</button>' : '') + '</td></tr>'; }), 'Nenhum cadastro ainda. Divulgue o link público.');
    $('voz-corpo').innerHTML = h;
    vozReenvioBotoes();
    $('vz-verif').onclick = function () { var b = this; b.disabled = true; vozChamar('vozVerificarAgora', [], function (r) { b.disabled = false; if (!r.ok) return aviso($('vz-vmsg'), 'erro', r.erro); aviso($('vz-vmsg'), 'ok', r.conferidos + ' termo(s) conferido(s), ' + r.assinados + ' assinado(s) pelas partes.' + (r.erros && r.erros.length ? ' Erros: ' + r.erros.join(' | ') : '')); if (r.assinados) setTimeout(function () { telaVoz('cred'); }, 1500); }); };
    document.querySelectorAll('[data-vzc]').forEach(function (b) { b.onclick = function () { vozFichaCred(d.creds[+b.getAttribute('data-vzc')]); }; });
  }
  function vozFichaCred(c) {
    var d = VOZX.d, linha = function (t, v) { return v ? '<tr><th style="width:180px">' + t + '</th><td style="white-space:pre-wrap">' + esc(v) + '</td></tr>' : ''; };
    var h = '<h2>' + esc(c.id) + ' · ' + esc(c.nome) + '</h2><p><span class="selo ' + vozSel(c.situacao) + '">' + esc(c.situacao) + '</span></p><div class="tab-wrap"><table>' +
      linha('Recebido em', c.recebido) + linha('E-mail', c.email) + linha('WhatsApp', c.zap) + linha('CPF', c.cpf) + linha('Cidade/UF', c.cidade) + linha('Formação', c.formacao) + linha('Área', c.area) +
      linha('Registro profissional', c.registro) + linha('Experiência', c.experiencia) + linha('Como pode contribuir', c.contribuicao) + linha('Colaboração', c.colab) + linha('Conflito de interesse', c.conflito) +
      linha('Análise', c.analise) + linha('Analisado por', c.analisadoPor) + linha('Termo (documento)', c.termoDoc) + linha('Termo assinado em', c.termoData) + '</table></div>' +
      (c.termoLink && c.termoLink !== 'Sim' ? '<p><a target="_blank" href="' + esc(c.termoLink) + '">Abrir o termo</a></p>' : '');
    if (d.decide) {
      var sit = c.situacao;
      h += '<label>Análise (identidade, qualificação, experiência e adequação à demanda)</label><textarea id="vc-an">' + esc(c.analise) + '</textarea><div class="botoes" style="margin-top:8px">';
      if (/recebido|em análise/i.test(sit)) h += '<button class="btn pq claro" data-vcs="Em análise">Salvar análise</button><button class="btn pq" data-vcs="Aprovado - aguardando termo">Aprovar</button><button class="btn pq claro" data-vcs="Não aprovado">Não aprovar</button>';
      if (/aguardando termo|termo enviado/i.test(sit)) h += '<button class="btn pq" id="vc-termo">' + (sit === 'Termo enviado' ? 'Gerar e enviar o termo de novo' : 'Gerar e enviar o termo') + '</button><button class="btn pq claro" id="vc-manual">Registrar termo assinado (manual)</button>';
      if (sit === 'Termo assinado') h += '<button class="btn pq" id="vc-lib">Liberar acesso à Área Técnica</button>';
      if (['Não aprovado', 'Encerrado'].indexOf(sit) < 0) h += '<button class="btn pq claro" data-vcs="Encerrado">Encerrar colaboração</button>';
      h += '</div><label class="check" style="font-weight:normal"><input type="checkbox" id="vc-avisar" checked> Ao não aprovar, avisar a pessoa por e-mail (mensagem cordial, sem detalhes da análise)</label>';
    }
    vozModal(h);
    document.querySelectorAll('[data-vcs]').forEach(function (b) { b.onclick = function () {
      var s = b.getAttribute('data-vcs'); if (s === 'Encerrado' && !confirm('Encerrar a colaboração e retirar o acesso aos materiais?')) return;
      vozChamar('vozCredAtualizar', [c.id, { situacao: s, analise: $('vc-an').value, avisar: $('vc-avisar').checked }], vozDepois('cred')); }; });
    if ($('vc-termo')) $('vc-termo').onclick = function () { var b = this; b.disabled = true; aviso($('vz-msg'), 'ok', 'Gerando o termo...');
      vozChamar('vozEnviarTermo', [c.id], function (r) { b.disabled = false; if (!r.ok) return aviso($('vz-msg'), 'erro', r.erro);
        if (r.manual) $('vz-msg').innerHTML = '<div class="msg ok">Termo gerado. Baixe o PDF, envie pelo site do Autentique para a pessoa e para a representante do MAP e, depois de assinado, registre aqui.<br><a target="_blank" href="' + esc(r.pdf) + '">Abrir o PDF do termo</a></div>';
        else { alert('Termo enviado pelo Autentique' + (r.teste ? ' (modo teste)' : '') + '. As duas partes recebem o pedido de assinatura por e-mail.'); $('modal').style.display = 'none'; telaVoz('cred'); } }); };
    if ($('vc-manual')) $('vc-manual').onclick = function () {
      vozModal('<h2>Termo assinado · ' + esc(c.id) + '</h2><label>Data da assinatura das partes *</label><input type="date" id="vm-data"><label>Link do documento assinado</label><input type="text" id="vm-link" placeholder="https://..."><label>ou anexe o PDF assinado</label><input type="file" id="vm-arq" accept=".pdf"><button class="btn" id="vm-ok" style="margin-top:10px">Registrar</button>');
      $('vm-ok').onclick = function () { haArq($('vm-arq')).then(function (arq) { vozChamar('vozTermoManual', [c.id, { data: $('vm-data').value, link: $('vm-link').value, arquivo: arq }], vozDepois('cred')); }).catch(function (e) { aviso($('vz-msg'), 'erro', e.message); }); };
    };
    if ($('vc-lib')) $('vc-lib').onclick = function () { vozChamar('vozLiberar', [c.id], function (r) { if (!r.ok) return aviso($('vz-msg'), 'erro', r.erro); alert(r.email ? 'Acesso liberado. A pessoa recebeu o link por e-mail.' : 'Acesso liberado, mas o e-mail não saiu (' + r.erroEmail + '). Use o botão Reenviar link.'); $('modal').style.display = 'none'; telaVoz('cred'); }); };
  }

   
  function vozMateriais() {
    var d = VOZX.d;
    var h = '<p style="font-size:13px">' + (d.equipe ? 'Cada material fica visível só para os especialistas das demandas em que ele for incluído. Relatos originais com dados pessoais não devem ser incluídos sem necessidade técnica.' : 'Materiais autorizados para as suas demandas. Não copie, baixe para uso pessoal nem compartilhe (termo de sigilo).') + '</p>' +
      haTab(['ID', 'Material', 'Tipo', 'Especialidades', 'Dados pessoais?', ''], d.materiais.map(function (m) {
        return '<tr><td>' + esc(m.id) + '</td><td><b>' + esc(m.titulo) + '</b>' + (m.descricao ? '<br><small>' + esc(m.descricao) + '</small>' : '') + '</td><td>' + esc(m.tipo) + '</td><td>' + esc(m.especialidades || 'Todas') + '</td><td>' + esc(m.pessoais) + '</td><td><a class="btn pq claro" target="_blank" href="' + esc(m.link) + '">Abrir</a></td></tr>'; }), 'Nenhum material.');
    if (d.decide || d.juridica) h += '<div class="card" style="margin-top:14px"><h2>Cadastrar material</h2><div class="duas"><div><label>Título *</label><input type="text" id="mt-tit"><label>Tipo *</label><select id="mt-tipo">' + haOpc(d.matTipos, '', 'Escolha') + '</select>' +
      '<label>Link no Google Drive do MAP (arquivo ou pasta) *</label><input type="text" id="mt-link"></div><div><label>Especialidades que podem ver</label><div class="checks">' + d.areas.map(function (a) { return '<label><input type="checkbox" class="mt-esp" value="' + esc(a) + '"> ' + esc(a) + '</label>'; }).join('') + '</div></div></div>' +
      '<label>Descrição</label><input type="text" id="mt-desc"><label class="check" style="font-weight:normal"><input type="checkbox" id="mt-pes"> Contém dados pessoais</label><button class="btn" id="mt-ok">Cadastrar</button><div id="mt-msg"></div></div>';
    $('voz-corpo').innerHTML = h;
    if ($('mt-ok')) $('mt-ok').onclick = function () { var esp = []; document.querySelectorAll('.mt-esp').forEach(function (x) { if (x.checked) esp.push(x.value); });
      vozChamar('vozMaterialSalvar', [{ titulo: $('mt-tit').value, tipo: $('mt-tipo').value, link: $('mt-link').value, descricao: $('mt-desc').value, especialidades: esp, pessoais: $('mt-pes').checked }], vozDepois('materiais', $('mt-msg'))); };
  }

   
  function vozDemandas() {
    var d = VOZX.d;
    if (!d.equipe) return vozDemandasEsp();
    var ativos = d.creds.filter(function (c) { return c.situacao === 'Acesso liberado'; });
    var h = '<h2>Demandas técnicas</h2>' + haTab(['ID', 'Especialista', 'Demanda', 'Materiais', 'Prazo', 'Situação'], d.demandas.map(function (x) {
      return '<tr><td>' + esc(x.id) + '</td><td>' + esc(x.nomeEsp) + '</td><td><b>' + esc(x.titulo) + '</b><br><small>' + esc(x.descricao) + '</small></td><td>' + esc(x.materiais.join(', ') || '—') + '</td><td>' + esc(x.prazo) + '</td><td>' +
        (d.decide ? '<select data-vds="' + esc(x.id) + '">' + haOpc(d.demSit, x.situacao) + '</select>' : esc(x.situacao)) + '</td></tr>'; }), 'Nenhuma demanda.');
    if (d.decide) h += '<div class="card" style="margin-top:14px"><h2>Nova demanda</h2><div class="duas"><div><label>Especialista *</label><select id="dm-esp">' + (ativos.map(function (c) { return '<option value="' + esc(c.email) + '">' + esc(c.nome + ' · ' + c.area) + '</option>'; }).join('') || '<option value="">Nenhum especialista com acesso liberado</option>') + '</select>' +
      '<label>Título *</label><input type="text" id="dm-tit"><label>Prazo</label><input type="date" id="dm-prazo"></div><div><label>Materiais autorizados</label><div class="checks">' + (d.materiais.map(function (m) { return '<label><input type="checkbox" class="dm-mat" value="' + esc(m.id) + '"> ' + esc(m.id + ' · ' + m.titulo) + '</label>'; }).join('') || '<span class="vazio">Cadastre os materiais primeiro.</span>') + '</div></div></div>' +
      '<label>O que precisa ser analisado (perguntas técnicas) *</label><textarea id="dm-desc"></textarea><button class="btn" id="dm-ok">Enviar demanda ao especialista</button><div id="dm-msg"></div></div>';
    h += '<h2 style="margin-top:16px">Entregas recebidas</h2>' + haTab(['ID', 'Demanda', 'Especialista', 'Tipo', 'Enviado', 'Situação', 'Revisão', ''], d.entregas.map(function (x, i) {
      return '<tr><td>' + esc(x.id) + '</td><td>' + esc(x.demanda) + '</td><td>' + esc(x.nomeEsp) + '</td><td>' + esc(x.tipo) + (x.obs ? '<br><small>' + esc(x.obs) + '</small>' : '') + '</td><td>' + esc(x.enviado) + '</td><td><span class="selo ' + vozSel(x.situacao) + '">' + esc(x.situacao) + '</span></td><td><small>' + esc(x.revisao) + '</small></td><td>' +
        (x.arquivo && x.arquivo !== 'Sim' ? '<a class="btn pq claro" target="_blank" href="' + esc(x.arquivo) + '">Abrir</a> ' : '') + (d.decide || d.juridica ? '<button class="btn pq" data-ver="' + i + '">Revisar</button>' : '') + '</td></tr>'; }), 'Nenhuma entrega.');
    $('voz-corpo').innerHTML = h;
    document.querySelectorAll('[data-vds]').forEach(function (s) { s.onchange = function () { if (s.value === 'Cancelada' && !confirm('Cancelar a demanda e retirar o acesso do especialista aos materiais dela?')) return telaVoz('demandas'); vozChamar('vozDemandaSalvar', [{ id: s.getAttribute('data-vds'), situacao: s.value }], function (r) { if (!r.ok) alert(r.erro); }); }; });
    if ($('dm-ok')) $('dm-ok').onclick = function () { var m = []; document.querySelectorAll('.dm-mat').forEach(function (x) { if (x.checked) m.push(x.value); });
      vozChamar('vozDemandaSalvar', [{ especialista: $('dm-esp').value, titulo: $('dm-tit').value, descricao: $('dm-desc').value, prazo: $('dm-prazo').value, materiais: m }], vozDepois('demandas', $('dm-msg'))); };
    document.querySelectorAll('[data-ver]').forEach(function (b) { b.onclick = function () {
      var x = d.entregas[+b.getAttribute('data-ver')], sits = d.entSit.filter(function (s) { return s !== 'Recebida' && (d.decide || s !== 'Integrada ao dossiê'); });
      vozModal('<h2>Revisar ' + esc(x.id) + ' · ' + esc(x.tipo) + '</h2><label>Situação</label><select id="vr-sit">' + haOpc(sits, sits[0]) + '</select><label>Comentário da revisão (vai para o especialista quando houver ajustes)</label><textarea id="vr-txt">' + esc(x.revisao) + '</textarea><button class="btn" id="vr-ok" style="margin-top:10px">Salvar revisão</button>');
      $('vr-ok').onclick = function () { vozChamar('vozEntregaRevisar', [x.id, { situacao: $('vr-sit').value, revisao: $('vr-txt').value }], vozDepois('demandas')); };
    }; });
  }

   
  function vozEquipe() {
    var d = VOZX.d;
    var h = '<div class="card"><h2>Dar acesso à equipe interna</h2><p style="font-size:12px;color:var(--texto-suave)">Coordenação JusArmy: credenciamento, demandas e revisão. Equipe jurídica: materiais e revisão das entregas. Apoio administrativo: acompanha cadastros, termos e entregas, sem CPF, contatos ou arquivos. A coordenação do JusArmy cadastrada no SOS Armys já entra como coordenação aqui. O acesso exige o termo de confidencialidade assinado.</p>' +
      '<div class="duas"><div><label>E-mail *</label><input type="email" id="eq-email"><label>Nome</label><input type="text" id="eq-nome"><label>Função *</label><select id="eq-func">' + haOpc(d.geral ? d.funcoes : d.funcoes.filter(function (f) { return f !== 'Coordenação JusArmy'; }), '', 'Escolha') + '</select></div>' +
      '<div><label>Data de assinatura do termo *</label><input type="date" id="eq-data"><label>Link do termo assinado</label><input type="text" id="eq-link"><label>ou anexe o PDF</label><input type="file" id="eq-arq" accept=".pdf"></div></div><button class="btn" id="eq-ok">Dar acesso</button><div id="eq-msg"></div></div>';
    h += '<div class="botoes"><button class="btn claro" id="vz-reall">Reenviar o link para todos com acesso</button></div><div id="vz-rmsg"></div>';

<script>
   
  var TAR = {};

<script>

  function reSelo(s) { var c = { 'Agendada': 'alerta', 'Realizada': 'ok', 'Cancelada': 'ruim', 'Não realizada': 'ruim', 'Livre': 'ok', 'Reservado': 'alerta', 'Bloqueado': '' }[s] || ''; return '<span class="selo ' + c + '">' + esc(s) + '</span>'; }

  }

   
  function reAgendar() {
    var d = RE.d, c = $('re-corpo');

      el.querySelectorAll('[data-reslot]').forEach(function (b) { b.onclick = function () { RE.slot = b.getAttribute('data-reslot'); reCalendario(); }; });

  function reFormAgendar() {

      '<label>Projeto ou setor *</label><select id="ra-proj"><option value="">Escolha</option>' + d.projetos.map(function (p) { return '<option value="' + esc(p.nome) + '" data-fr="' + esc(p.frente) + '">' + esc(p.nome) + (p.frente ? ' (' + esc(p.frente) + ')' : '') + '</option>'; }).join('') +

  function reAcao(tipo, id) {

  function reFormHost(h, p) {

      '<label style="font-weight:normal;display:flex;gap:8px;align-items:center"><input type="checkbox" id="' + p + '-assist"' + (h.assist ? ' checked' : '') + '> Chamar automaticamente a assistente geral da frente do projeto que agendou</label>' +
      (RE.d.gestao ? '<label style="font-weight:normal;display:flex;gap:8px;align-items:center"><input type="checkbox" id="' + p + '-ativa"' + (h.ativa ? ' checked' : '') + '> Agenda ativa (aparece para a equipe agendar)</label>' : '') +

  function reLigarHost(p, emailOriginal) {

      chamar('reuAnfitriaSalvar', [S.email, S.token, { email: em, nome: $(p + '-nome').value, cargo: $(p + '-cargo').value, link: $(p + '-link').value, obrig: $(p + '-obrig').value,
        assist: $(p + '-assist').checked, ativa: $(p + '-ativa') ? $(p + '-ativa').checked : true }], function (r) {

  function reAssistentes() {

      '<div class="tab-wrap"><table><thead><tr><th>Frente</th><th>Nome da assistente geral</th><th>E-mail</th></tr></thead><tbody>' + fr.map(function (f, i) {

        return '<tr><td><input type="text" id="as-f' + i + '" value="' + esc(f) + '"></td><td><input type="text" id="as-n' + i + '" value="' + esc(a.nome || '') + '"></td><td><input type="text" id="as-e' + i + '" value="' + esc(a.email || '') + '"></td></tr>'; }).join('') +
      '<tr><td><input type="text" id="as-f' + fr.length + '" placeholder="Outra frente"></td><td><input type="text" id="as-n' + fr.length + '"></td><td><input type="text" id="as-e' + fr.length + '"></td></tr></tbody></table></div>' +

      var b = this, l = [];
      for (var i = 0; i <= fr.length; i++) { var n = $('as-n' + i).value.trim(), e = $('as-e' + i).value.trim(); if (n || e) l.push({ frente: $('as-f' + i).value, nome: n, email: e }); }
      b.disabled = true;
      chamar('reuAssistentesSalvar', [S.email, S.token, l], function (r) { b.disabled = false; if (!r.ok) return reMsg('erro', r.erro); reRecarregar('Assistentes salvas.'); });
    };
  }

   
  function reRegras() {

      '<label style="font-weight:normal;display:flex;gap:8px;align-items:center"><input type="checkbox" id="rr-qz"' + (g.quinzena ? ' checked' : '') + '> Só uma reunião por quinzena por projeto (dias 1 a 15 e 16 em diante)</label>' +

<script>
   
  var SO = { d: null, aba: 'pedidos', filtro: 'pendentes', ferAberta: '' };
  function telaSolicitacoes(alvo) {
    SO.alvo = alvo || '';
    $(SO.alvo || 'conteudo').innerHTML = '<p class="carregando">Carregando as solicitações...</p>';
    chamar('solDados', [S.email, S.token], function (r) {
      if (!r.ok) { $(SO.alvo || 'conteudo').innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      SO.d = r; soDesenhar();
    });
  }
  function soRecarregar(txt) { chamar('solDados', [S.email, S.token], function (r) { if (r.ok) { SO.d = r; soDesenhar(); if (txt) soMsg('ok', txt); } }); }
  function soMsg(t, x) { var m = $('so-msg'); if (m) { aviso(m, t, x); m.scrollIntoView({ block: 'nearest' }); } }
  function soSelo(s) { var c = { 'Aprovado': 'ok', 'Recusado': 'ruim', 'Aguardando coordenação': 'alerta', 'Aguardando RH': 'alerta', 'Em licença': 'alerta', 'Programada': '' }[s] || ''; return '<span class="selo ' + c + '">' + esc(s) + '</span>'; }
  function soDesenhar() {
    var d = SO.d;
    var abas = [['pedidos', d.rh ? 'Pedidos' : 'Pedidos da minha equipe']].concat(d.rh ? [['licencas', 'Em licença (' + d.licencas.length + ')'], ['ferias', 'Férias'], ['regras', 'Regras']] : []);

      'Licença e desligamento passam primeiro pela coordenação do projeto e depois pelo RH. Atualização de dados vai direto ao RH.' + (d.rh ? ' Férias: só o RH e a Gestão Geral lançam.' : '') + '</p>' +
      '<div class="msg" style="background:#f8f2f9">Para fazer o seu próprio pedido, ou passar o link para a equipe: <a href="' + esc(d.link) + '" target="_blank" rel="noopener">Minhas solicitações</a></div>' +
      '<div class="botoes" style="margin-top:14px">' + abas.map(function (a) { return '<button class="btn ' + (SO.aba === a[0] ? '' : 'claro') + '" data-soaba="' + a[0] + '">' + a[1] + '</button>'; }).join('') + '</div><div id="so-msg"></div><div id="so-corpo"></div>';
    document.querySelectorAll('[data-soaba]').forEach(function (b) { b.onclick = function () { SO.aba = b.getAttribute('data-soaba'); soDesenhar(); }; });
    ({ pedidos: soPedidos, licencas: soLicencas, ferias: soFerias, regras: soRegras })[SO.aba]();
  }

   
  function soPedidos() {
    var d = SO.d, c = $('so-corpo');
    var pend = function (p) { return p.situacao === 'Aguardando coordenação' || p.situacao === 'Aguardando RH'; };

    c.innerHTML = '<div class="botoes"><select id="so-fil" style="max-width:240px"><option value="pendentes">Aguardando decisão</option><option value="todos">Todos</option></select></div>' +
      (l.length ? l.map(soCartao).join('') : '<p class="vazio">' + (SO.filtro === 'todos' ? 'Nenhuma solicitação ainda.' : 'Nenhum pedido aguardando decisão.') + '</p>');
    $('so-fil').value = SO.filtro;
    $('so-fil').onchange = function () { SO.filtro = this.value; soPedidos(); };

  }
  function soCartao(p) {
    var d = SO.d, ac = '';
    if (p.situacao === 'Aguardando coordenação' && (p.souCoord || d.rh)) ac = '<button class="btn pq" data-soac="encaminhar" data-id="' + esc(p.id) + '">Encaminhar ao RH</button> <button class="btn pq claro" data-soac="desistiu" data-id="' + esc(p.id) + '">A pessoa desistiu</button>';
    if (d.rh && (p.situacao === 'Aguardando RH' || p.situacao === 'Aguardando coordenação')) ac += ' <button class="btn pq" data-soac="aprovar" data-id="' + esc(p.id) + '">Aprovar</button> <button class="btn pq claro" data-soac="recusar" data-id="' + esc(p.id) + '">Recusar</button>';
    return '<div class="card" style="margin-bottom:12px">' + soSelo(p.situacao) + ' <b>' + esc(p.tipo) + '</b> · ' + esc(p.nome) + ' <small style="color:var(--texto-suave)">(' + esc(p.mat) + ') · ' + esc(p.id) + ' · pedido em ' + esc(p.data) + '</small>' +
      '<p style="margin:6px 0;font-size:14px">' + esc(p.projeto || '') + (p.funcao ? ' · ' + esc(p.funcao) : '') + (p.inicio ? '<br><b>' + (p.tipo === 'Retorno de licença' ? 'Volta em ' : 'A partir de ') + esc(p.inicio) + '</b>' + (p.fim ? ' até ' + esc(p.fim) + ' (' + p.dias + ' dias)' : '') : '') + '</p>' +
      (p.dados ? '<p style="margin:4px 0;font-size:14px;white-space:pre-line"><b>O que mudou:</b>\n' + esc(p.dados) + '</p>' : '') +
      (p.motivo ? '<p style="margin:4px 0;font-size:13px"><b>Motivo:</b> ' + esc(p.motivo) + '</p>' : '') +
      (p.parecerCoord ? '<p style="margin:4px 0;font-size:13px;color:var(--texto-suave)"><b>Coordenação</b> (' + esc(p.coordQuem || '') + '): ' + esc(p.parecerCoord) + '</p>' : (p.coord ? '<p style="margin:4px 0;font-size:13px;color:var(--texto-suave)">Coordenação: ' + esc(p.coord) + '</p>' : '')) +
      (p.parecerRH || p.rhQuem ? '<p style="margin:4px 0;font-size:13px;color:var(--texto-suave)"><b>RH</b> (' + esc(p.rhQuem) + '): ' + esc(p.parecerRH) + (p.resultado ? ' · ' + esc(p.resultado) : '') + '</p>' : '') +
      (ac ? '<div class="botoes" style="margin-bottom:0">' + ac + '</div><div id="so-ac-' + esc(p.id) + '"></div>' : '') + '</div>';
  }
  function soAcao(id, acao, botao) {
    var p = SO.d.pedidos.filter(function (x) { return x.id === id; })[0], box = $('so-ac-' + id);
    var rot = { encaminhar: 'O que você conversou com a pessoa (vai para o RH) *', desistiu: 'Registro da conversa (por que a pessoa desistiu) *', aprovar: 'Observação do RH (opcional; a pessoa recebe)', recusar: 'Motivo da recusa (a pessoa recebe) *' }[acao];
    var extra = acao === 'aprovar' && (p.tipo === 'Desligamento' || p.tipo === 'Distrato de parceria') ? '<p style="font-size:13px;color:var(--amarelo)">Ao aprovar, o desligamento é aberto em RH e SAM > Desligamentos, com o nome, o e-mail e o projeto. Lá você segue com o levantamento do Drive, o distrato e o aviso.</p>' :
      acao === 'aprovar' && p.tipo === 'Atualização de dados' ? '<p style="font-size:13px;color:var(--amarelo)">Ao aprovar, celular, e-mail, cidade, estado e país são atualizados no Cadastro Único (o e-mail antigo fica guardado como alternativo, e a aba Acessos também é atualizada). Endereço e outras informações ficam registrados na aba Atualizacoes.</p>' : '';
    box.innerHTML = extra + '<label>' + rot + '</label><textarea id="so-tx-' + esc(id) + '"></textarea><div class="botoes"><button class="btn" id="so-ok-' + esc(id) + '">Confirmar</button><button class="btn claro" id="so-x-' + esc(id) + '">Voltar</button></div>';
    $('so-x-' + id).onclick = function () { box.innerHTML = ''; };
    $('so-ok-' + id).onclick = function () {
      var b = this, tx = $('so-tx-' + id).value; b.disabled = true;
      var fim = function (r, ok) { b.disabled = false; if (!r.ok) return soMsg('erro', r.erro); soRecarregar(ok); };
      if (acao === 'encaminhar' || acao === 'desistiu') chamar('solCoordDecidir', [S.email, S.token, id, acao, tx], function (r) { fim(r, acao === 'encaminhar' ? 'Encaminhado ao RH. A pessoa foi avisada.' : 'Registrado como desistência.'); });
      else chamar('solRhDecidir', [S.email, S.token, id, acao === 'aprovar', tx, {}], function (r) { fim(r, (acao === 'aprovar' ? 'Aprovado' : 'Recusado') + (r.resultado ? ' · ' + r.resultado : '') + '. A pessoa recebeu a resposta por e-mail.'); });
    };
  }

   
  function soLicencas() {
    var l = SO.d.licencas;
    $('so-corpo').innerHTML = l.length ? '<div class="tab-wrap"><table><thead><tr><th>Pessoa</th><th>Projeto</th><th>Período</th><th>Situação</th></tr></thead><tbody>' + l.map(function (x) {
      return '<tr><td>' + esc(x.nome) + '<br><small>' + esc(x.mat) + ' · ' + esc(x.id) + '</small></td><td>' + esc(x.projeto) + '</td><td>' + esc(x.inicio) + ' a ' + esc(x.fim) + ' (' + x.dias + ' dias)' +
        (x.faltam >= 0 && x.faltam <= 3 ? '<br><span class="selo alerta">termina em ' + x.faltam + ' dia(s)</span>' : '') + '</td><td>' + soSelo(x.situacao) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<p style="font-size:13px;color:var(--texto-suave)">No fim do prazo, a licença é encerrada sozinha e a pessoa recebe as boas-vindas de volta. Três dias antes, ela recebe um aviso.</p>'

  }

   
  function soFerias() {
    var d = SO.d, c = $('so-corpo'), g = d.regras;
    var l = d.ferias;
    c.innerHTML = '<p style="font-size:13px;color:var(--texto-suave)">Equipe ativa: quem tem contrato ou adendo no Histórico do Cadastro Único depois do último desligamento (ou está na aba Equipe). A cada ' + g.ferMeses + ' meses desde a entrada (data do contrato atual), a pessoa tem até ' + g.ferMax + ' dias de férias para tirar dentro do período. Não acumula. Só o RH e a Gestão Geral lançam.</p>' +

    var desenhar = function () {
      var b = ($('sf-busca').value || '').toLowerCase();
      $('sf-corpo').innerHTML = l.filter(function (x) { return !b || (x.nome + ' ' + x.mat + ' ' + x.projetos).toLowerCase().indexOf(b) >= 0; }).slice(0, 300).map(function (x) {
        var f = x.f, per = f.semData ? '<span class="selo ruim">sem data de entrada</span>' : (f.periodoIni ? esc(f.periodoIni) + ' a ' + esc(f.periodoFim) : 'a partir de ' + esc(f.proximo));
        return '<tr><td>' + esc(x.nome) + '<br><small>' + esc(x.mat) + ' · ' + esc(x.projetos) + '</small>' + (x.marcadas.length ? '<br><small>Marcadas: ' + x.marcadas.map(function (m) { return esc(m.inicio) + ' a ' + esc(m.fim) + ' <a href="#" data-sfc="' + esc(m.id) + '">cancelar</a>'; }).join('; ') + '</small>' : '') +
          '</td><td>' + esc(x.entrada || '-') + '</td><td>' + per + '</td><td>' + (f.periodoIni ? '<b>' + f.saldo + '</b> de ' + f.max + ' dias' : '-') + '</td><td>' +
          (f.periodoIni && f.saldo > 0 ? '<button class="btn pq" data-sfl="' + esc(x.mat) + '">Lançar férias</button>' : '') + '</td></tr>' +
          (SO.ferAberta === x.mat ? '<tr><td colspan="5" style="background:#faf7fc"><div class="duas"><div><label>Início (dd/mm/aaaa, dentro do período)</label><input type="text" id="sf-ini"></div><div><label>Dias (até ' + f.saldo + ')</label><input type="text" id="sf-dias" value="' + Math.min(7, f.saldo) + '"></div></div>' +
            '<label>Observação</label><input type="text" id="sf-obs"><div class="botoes"><button class="btn" id="sf-ok">Lançar</button><button class="btn claro" id="sf-x">Cancelar</button></div></td></tr>' : '');
      }).join('') || '<tr><td colspan="5" class="vazio">Ninguém encontrado.</td></tr>';
      c.querySelectorAll('[data-sfl]').forEach(function (b) { b.onclick = function () { SO.ferAberta = b.getAttribute('data-sfl'); desenhar(); }; });
      c.querySelectorAll('[data-sfc]').forEach(function (a) { a.onclick = function (e) {
        e.preventDefault(); var m = prompt('Motivo do cancelamento das férias:'); if (m === null) return;
        chamar('solFeriasCancelar', [S.email, S.token, a.getAttribute('data-sfc'), m], function (r) { if (!r.ok) return soMsg('erro', r.erro); soRecarregar('Férias canceladas. A pessoa foi avisada.'); });
      }; });
      if ($('sf-x')) $('sf-x').onclick = function () { SO.ferAberta = ''; desenhar(); };
      if ($('sf-ok')) $('sf-ok').onclick = function () {
        var b = this; b.disabled = true;
        chamar('solFeriasLancar', [S.email, S.token, { mat: SO.ferAberta, inicio: $('sf-ini').value, dias: $('sf-dias').value, obs: $('sf-obs').value }], function (r) {
          b.disabled = false; if (!r.ok) return soMsg('erro', r.erro); SO.ferAberta = ''; soRecarregar('Férias lançadas (' + r.id + '). A pessoa e a coordenação foram avisadas.');
        });

    $('sf-busca').oninput = desenhar;
    desenhar();

  function soRegras() {
    var g = SO.d.regras, pode = S.dados && S.dados.gestao;
    var inp = function (id, rot, v) { return '<label>' + rot + '</label><input type="text" id="' + id + '" value="' + esc(String(v)) + '"' + (pode ? '' : ' disabled') + '>'; };
    $('so-corpo').innerHTML = '<div class="card"><div class="duas"><div>' + inp('sr-lmin', 'Licença: mínimo de dias', g.licMin) + '</div><div>' + inp('sr-lmax', 'Licença: máximo de dias somados no ano', g.licMax) + '</div></div>' +
      '<div class="duas"><div>' + inp('sr-fm', 'Férias: a cada quantos meses de MAP', g.ferMeses) + '</div><div>' + inp('sr-fx', 'Férias: máximo de dias por período (não acumula)', g.ferMax) + '</div></div>' +
      '<div class="duas"><div>' + inp('sr-ac', 'Se a coordenação não responder, seguir ao RH em (dias)', g.autoCoord) + '</div><div>' + inp('sr-lr', 'Lembrar o RH de pedidos parados a cada (dias)', g.lembreteRH) + '</div></div>' +
      (pode ? '<div class="botoes"><button class="btn" id="sr-ok">Salvar regras</button></div>' : '<p style="font-size:13px;color:var(--texto-suave)">Só a Gestão Geral altera as regras.</p>') + '</div>';

        b.disabled = false; if (!r.ok) return soMsg('erro', r.erro); soRecarregar('Regras salvas.');

<script>
   
  var EQ = { area: '', alvo: '', d: null, aba: '', filtro: 'abertas', form: '' };
  function eqdTela(area, alvo) {

    el.innerHTML = '<div class="card secao"><p class="carregando" style="padding:6px 0">Carregando a equipe e as demandas...</p></div>';

<script>
   
  var PR = { d: null, aba: 'cadastro', busca: '', filtro: 'todos', ed: '' };

      '<div><label>Mostrar</label><select id="pr-fil"><option value="todos">Todos (' + d.pessoas.length + ')</option><option value="equipe">Equipe e voluntários</option><option value="parceria">Parceiros e profissionais</option><option value="semdias">Sem dias registrados (' + sem + ')</option></select></div></div>' +

  function prEditor(mat) {

      chamar('preDispSalvar', [S.email, S.token, { mat: mat, dias: dias, acompanhar: $('pe-acomp').checked, obs: $('pe-obs').value }], function (r) {

  function prAusencias() {

<script>
   
  var FI = { alvo: '', termo: '', itens: null, d: null };

      r.itens.map(function (p) {

    document.querySelectorAll('[data-fiab]').forEach(function (b) { b.onclick = function () { ficAbrir(b.getAttribute('data-fiab')); }; });
  }
  function ficAbrir(mat, txt) {

    chamar('ficDados', [S.email, S.token, mat], function (r) {
