      passo(3, 'Aviso formal com os prazos', 'E-mail para todos os e-mails da pessoa, com cópia para o RH e para o MAP: prazos, lista do que transferir (em anexo) e o passo a passo. Depois disso, o sistema cobra sozinho 7, 3 e 1 dia antes e no dia.',
        '<button class="btn pq" data-desac="aviso">' + (x.aviso ? 'Reenviar aviso' : 'Enviar aviso') + '</button>') +
      passo(4, 'Conferir o repasse', 'Aceita as transferências feitas para o MAP e atualiza o que falta. Roda sozinho todos os dias às 9h.',
        '<button class="btn pq claro" data-desac="conferir">Conferir agora</button>') +
      passo(5, 'Cópias de segurança', 'Copia para uma pasta do MAP os arquivos que ainda são da pessoa, para não perder o conteúdo se ela não transferir.' + (x.copias ? ' <a target="_blank" href="https://drive.google.com/drive/folders/' + esc(x.copias) + '">Abrir a pasta de cópias</a>' : ''),
        '<button class="btn pq claro" data-desac="copias">Fazer cópias</button>') +
      passo(6, 'Retirar acessos', 'Drive: tira a pessoa das pastas e arquivos do MAP (os arquivos que são dela continuam com ela até a transferência). Portal: tira de Health Army, SOS Armys, Sua Voz Importa, Gestão Geral e inativa no Cadastro Único.',
        '<button class="btn pq claro" data-desac="ret-drive">Retirar do Drive</button><button class="btn pq claro" data-desac="ret-portal">Retirar do Portal</button>') +
      '<div class="botoes" style="margin-top:12px"><button class="btn claro" data-desac="editar">Editar dados</button><button class="btn" data-desac="concluir">Concluir desligamento</button><button class="btn claro" data-desac="cancelar">Cancelar desligamento</button><button class="btn claro" data-desac="fechar">Fechar</button></div>';
    else h += '<div class="botoes"><button class="btn claro" data-desac="fechar">Fechar</button></div>';
    h += '<div id="des-msg"></div><div id="des-man"></div><h2 style="margin-top:14px">Itens no Drive</h2><select id="des-filtro" style="max-width:260px"><option value="pend">A transferir para o MAP</option><option value="ok">Transferidos</option><option value="ret">Acessos a retirar</option><option value="todos">Todos</option></select><div id="des-itens"><p class="carregando">Carregando...</p></div></div>';
    el.innerHTML = h;
    $('des-filtro').value = DES.filtro;
    $('des-filtro').onchange = function () { DES.filtro = this.value; desItensTela(id); };
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.querySelectorAll('[data-desac]').forEach(function (b) { b.onclick = function () { desAcao(x, b.getAttribute('data-desac'), b); }; });
    desItensTela(id);
  }
  function desItensTela(id) {
    chamar('desItens', [S.email, S.token, id], function (r) {
      var el = $('des-itens'); if (!el) return;
      if (!r.ok) return aviso(el, 'erro', r.erro);
      var mapa = { pend: 'Transferir para o MAP', ok: 'Transferido ao MAP', ret: 'Retirar acesso' };
      var l = r.itens.filter(function (i) { return DES.filtro === 'todos' || i.situacao === mapa[DES.filtro]; });
      el.innerHTML = l.length ? '<div class="tab-wrap" style="max-height:420px;overflow:auto"><table><thead><tr><th>Item</th><th>Tipo</th><th>Relação</th><th>Situação</th><th>Cópia</th></tr></thead><tbody>' +
        l.map(function (i) { return '<tr><td><a target="_blank" href="' + esc(i.link) + '">' + esc(i.nome) + '</a></td><td>' + esc(i.tipo) + '</td><td>' + esc(i.relacao) + '</td><td>' + esc(i.situacao) + '</td><td>' + (i.copia ? '<a target="_blank" href="' + esc(i.copia) + '">abrir</a>' : '') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' : '<p class="vazio">Nenhum item nesta lista.' + (r.total ? '' : ' Clique em "Levantar agora".') + '</p>';
    });
  }
  function desAcao(x, ac, b) {
    var msg = $('des-msg'), fim = function (txt) { return function (r) { if (b) b.disabled = false; if (!r.ok) return aviso(msg, 'erro', r.erro); aviso(msg, 'ok', typeof txt === 'function' ? txt(r) : txt); setTimeout(function () { desTela(DES.alvo); }, 2500); }; };
    if (ac === 'fechar') { DES.aberto = ''; $('des-det').innerHTML = ''; return; }
    if (ac === 'editar') { desForm(x); return; }
    if (ac === 'manual') {
      $('des-man').innerHTML = '<div class="pend"><label>Data da assinatura</label><input type="text" id="dm-data" placeholder="dd/mm/aaaa"><label>Arquivo do distrato assinado (PDF)</label><input type="file" id="dm-arq" accept=".pdf,image/*"><label>ou link do documento assinado</label><input type="text" id="dm-link"><div class="botoes" style="margin-top:8px"><button class="btn pq" id="dm-ok">Registrar</button></div></div>';
      $('dm-ok').onclick = function () { haArq($('dm-arq')).then(function (arq) { chamar('desDistratoManual', [S.email, S.token, x.id, { data: $('dm-data').value, link: $('dm-link').value, arquivo: arq }], fim('Distrato assinado registrado.')); }).catch(function (e) { aviso(msg, 'erro', e.message); }); };
      return;
    }
    var conf = {
      autentique: 'Enviar o distrato pelo Autentique para ' + x.nome + ' e para o representante do MAP assinarem?',
      aviso: 'Enviar agora o aviso formal de desligamento para ' + x.emails + ' (com cópia para o RH e o MAP)?',
      'ret-drive': 'Retirar ' + x.nome + ' de todas as pastas e arquivos do MAP em que ela ainda tem acesso? Isso não pode ser desfeito pelo Portal.',
      'ret-portal': 'Retirar ' + x.nome + ' de todas as áreas do Portal (Health Army, SOS, Sua Voz Importa, Gestão Geral) e inativar no Cadastro Único?',
      concluir: 'Concluir este desligamento?', cancelar: 'Cancelar este desligamento?'
    };
    if (conf[ac] && !confirm(conf[ac])) return;
    if (b) b.disabled = true;
    aviso(msg, 'ok', 'Processando... isso pode levar alguns minutos.');
    if (ac === 'levantar') chamar('desLevantar', [S.email, S.token, x.id], fim(function (r) { return r.encontrados + ' itens encontrados: ' + r.criados + ' criados pela pessoa, ' + r.edita + ' em que ela edita e ' + r.ve + ' em que ela só vê.'; }));
    else if (ac === 'pdf') chamar('desDistrato', [S.email, S.token, x.id, 'pdf'], function (r) { if (b) b.disabled = false; if (!r.ok) return aviso(msg, 'erro', r.erro); msg.innerHTML = '<div class="msg ok">Distrato gerado. <a target="_blank" href="' + esc(r.pdf) + '">Abrir o PDF</a></div>'; });
    else if (ac === 'autentique') chamar('desDistrato', [S.email, S.token, x.id, 'autentique'], fim('Distrato enviado pelo Autentique. O sistema confere as assinaturas todos os dias.'));
    else if (ac === 'aviso') chamar('desAviso', [S.email, S.token, x.id], fim(function (r) { return 'Aviso enviado para ' + r.para.join(', ') + ' com ' + r.itens + ' item(ns) a transferir.'; }));
    else if (ac === 'conferir') chamar('desConferir', [S.email, S.token, x.id], fim(function (r) { return r.conferidos + ' conferidos: ' + r.transferidos + ' já são do MAP (' + r.aceitos + ' aceitos agora), ' + r.pendentes + ' ainda pendentes' + (r.sumiram ? ', ' + r.sumiram + ' o MAP perdeu o acesso' : '') + (r.parcial ? '. Clique de novo para continuar.' : '.'); }));
    else if (ac === 'copias') chamar('desCopias', [S.email, S.token, x.id], fim(function (r) { return r.copiados + ' cópia(s) feitas' + (r.erros ? ', ' + r.erros + ' não puderam ser copiadas' : '') + (r.parcial ? '. Clique de novo para continuar.' : '.'); }));
    else if (ac === 'ret-drive') chamar('desRetirarAcessos', [S.email, S.token, x.id, 'drive'], fim(function (r) { return 'Acesso retirado em ' + r.drive + ' item(ns)' + (r.driveErros ? '; ' + r.driveErros + ' não puderam ser alterados (confira na lista)' : '') + (r.parcial ? '. Clique de novo para continuar.' : '.'); }));
    else if (ac === 'ret-portal') chamar('desRetirarAcessos', [S.email, S.token, x.id, 'portal'], fim(function (r) { return r.portal.length ? 'Retirado: ' + r.portal.join(' · ') : 'A pessoa não tinha acessos no Portal.'; }));
    else if (ac === 'concluir') chamar('desSituacao', [S.email, S.token, x.id, 'Concluído'], fim('Desligamento concluído.'));
    else if (ac === 'cancelar') chamar('desSituacao', [S.email, S.token, x.id, 'Cancelado'], fim('Desligamento cancelado.'));
  }
</script>
<script>
   
  var RH = { alvo: '', d: null, aba: 'vagas', filtro: 'abertas', busca: '' };
  function rhTela(alvo) {
    RH.alvo = alvo; var el = $(alvo); if (!el) return;
    el.innerHTML = '<p class="carregando">Carregando o painel do RH...</p>';
    chamar('rhDados', [S.email, S.token], function (r) {
      if (!r.ok) { el.innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      if (!r.pode) { el.innerHTML = ''; return; }
      RH.d = r; rhDesenhar();
    });
  }
  function rhOpc(l, sel, vazio) { return (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + l.map(function (x) { var v = typeof x === 'object' ? x.codigo : x, t = typeof x === 'object' ? x.nome + ' (' + x.codigo + ')' : x; return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join(''); }
  function rhIn(id, rot, val, ph) { return '<label>' + rot + '</label><input type="text" id="' + id + '" value="' + esc(val || '') + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>'; }
  function rhTx(id, rot, val) { return '<label>' + rot + '</label><textarea id="' + id + '">' + esc(val || '') + '</textarea>'; }
  function rhMsg(t, x) { var m = $('rh-msg'); if (m) aviso(m, t, x); }
  function rhDesenhar() {
    var d = RH.d, el = $(RH.alvo);
    var abas = [['vagas', 'Vagas'], ['pedidos', 'Pedidos das equipes'], ['cand', 'Candidaturas'], ['contr', 'Contratações e adendos']].concat(d.mary ? [['protecao', 'Proteger planilhas']] : []);
    el.innerHTML = '<div class="card" style="margin-top:22px"><h2>RH no painel</h2><p style="font-size:13px;color:var(--texto-suave);margin-top:-6px">Vagas, pedidos das equipes, candidaturas, contratação e adendo, tudo pelo Portal, sem abrir as planilhas.</p>' +
      '<div class="botoes">' + abas.map(function (a) { return '<button class="btn ' + (RH.aba === a[0] ? '' : 'claro') + '" data-rhaba="' + a[0] + '">' + a[1] + '</button>'; }).join('') + '</div><div id="rh-msg"></div><div id="rh-corpo"></div></div>';
    el.querySelectorAll('[data-rhaba]').forEach(function (b) { b.onclick = function () { RH.aba = b.getAttribute('data-rhaba'); RH.filtro = RH.aba === 'vagas' ? 'abertas' : ''; RH.busca = ''; rhDesenhar(); }; });
    ({ vagas: rhVagas, pedidos: rhPedidos, cand: rhCands, contr: rhContr, protecao: rhProtecao })[RH.aba]();
  }
  function rhRecarregar(txt) { if (txt) rhMsg('ok', txt); setTimeout(function () { rhTela(RH.alvo); }, 1200); }

   
  function rhVagas() {
    var d = RH.d, c = $('rh-corpo');
    var l = d.vagas.filter(function (v) { return (RH.filtro !== 'abertas' || v['Status'] === 'Aberta') && (!RH.busca || (v['Vaga'] + ' ' + v['Projeto / Frente'] + ' ' + v['ID']).toLowerCase().indexOf(RH.busca) >= 0); });
    c.innerHTML = '<div class="botoes"><button class="btn" id="rv-nova">Nova vaga</button><select id="rv-f" style="max-width:200px"><option value="abertas">Só abertas</option><option value="todas">Todas</option></select>' +
      '<input type="text" id="rv-b" placeholder="Buscar vaga ou projeto" style="max-width:260px" value="' + esc(RH.busca) + '"></div><div id="rv-form"></div>' +
      (l.length ? '<div class="tab-wrap"><table><thead><tr><th>ID</th><th>Vaga</th><th>Projeto / Frente</th><th>Área · caminho</th><th>Situação</th><th></th></tr></thead><tbody>' +
        l.map(function (v) { return '<tr><td>' + esc(v['ID']) + '</td><td>' + esc(v['Vaga']) + '<br><small>' + esc([v['Quantidade de vagas'] ? v['Quantidade de vagas'] + ' vaga(s)' : '', v['Modalidade'], v['Carga horária']].filter(Boolean).join(' · ')) + '</small></td><td>' + esc(v['Projeto / Frente']) +
          '</td><td>' + esc(v['Área (código)']) + ' · ' + esc(v['Caminho (código)']) + '</td><td>' + esc(v['Status']) + '</td><td><button class="btn pq claro" data-rv="' + v.linha + '">Editar</button></td></tr>'; }).join('') + '</tbody></table></div>'
        : '<p class="vazio">Nenhuma vaga nesta lista.</p>');
    $('rv-f').value = RH.filtro;
    $('rv-f').onchange = function () { RH.filtro = this.value; rhVagas(); };
    $('rv-b').onchange = function () { RH.busca = this.value.toLowerCase().trim(); rhVagas(); };
    $('rv-nova').onclick = function () { rhVagaForm(null); };
    c.querySelectorAll('[data-rv]').forEach(function (b) { b.onclick = function () { var n = +b.getAttribute('data-rv'); rhVagaForm(d.vagas.filter(function (v) { return v.linha === n; })[0]); }; });
  }
  function rhVagaForm(v) {
    var d = RH.d, f = $('rv-form');
    v = v || { linha: 0, 'ID': '', 'Status': 'Aberta', 'Caminho (código)': (d.caminhos[0] || {}).codigo || '' };
    f.innerHTML = '<div class="card" style="margin:12px 0;background:#faf7fc"><h2>' + (v.linha ? 'Editar ' + esc(v['ID']) : 'Nova vaga') + '</h2><div class="duas"><div>' +
      rhIn('vf-nome', 'Nome da vaga *', v['Vaga']) + rhIn('vf-proj', 'Projeto / Frente', v['Projeto / Frente']) +
      '<label>Área no Portal do RH *</label><select id="vf-area">' + rhOpc(d.areas, v['Área (código)'], 'Escolha') + '</select>' +
      '<label>Caminho</label><select id="vf-cam">' + rhOpc(d.caminhos, v['Caminho (código)'], null) + '</select>' +
      '<label>Situação *</label><select id="vf-sit">' + rhOpc(['Aberta', 'Fechada'], v['Status']) + '</select>' +
      '<div class="duas"><div>' + rhIn('vf-qtd', 'Quantidade de vagas', v['Quantidade de vagas']) + '</div><div>' + rhIn('vf-mod', 'Modalidade', v['Modalidade'], 'Online, presencial...') + '</div></div>' +
      '<div class="duas"><div>' + rhIn('vf-carga', 'Carga horária', v['Carga horária']) + '</div><div>' + rhIn('vf-prazo', 'Prazo para se candidatar', v['Prazo para se candidatar'], 'dd/mm/aaaa') + '</div></div></div><div>' +
      rhTx('vf-desc', 'Descrição (o que a pessoa lê)', v['Descrição (o que a pessoa lê)']) + rhTx('vf-faz', 'O que a pessoa vai fazer', v['O que a pessoa vai fazer']) +
      rhTx('vf-req', 'Requisitos', v['Requisitos']) + rhIn('vf-obs', 'Observações internas', v['Observações']) + '</div></div>' +
      '<div class="botoes"><button class="btn" id="vf-ok">Salvar vaga</button>' + (v.linha ? '<button class="btn claro" id="vf-del">Remover vaga</button>' : '') + '<button class="btn claro" id="vf-x">Cancelar</button></div></div>';
    f.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('vf-x').onclick = function () { f.innerHTML = ''; };
    $('vf-ok').onclick = function () {
      var b = this; b.disabled = true;
      chamar('rhVagaSalvar', [S.email, S.token, { linha: v.linha, 'ID': v['ID'], 'Vaga': $('vf-nome').value, 'Projeto / Frente': $('vf-proj').value, 'Área (código)': $('vf-area').value,
        'Caminho (código)': $('vf-cam').value, 'Status': $('vf-sit').value, 'Quantidade de vagas': $('vf-qtd').value, 'Modalidade': $('vf-mod').value, 'Carga horária': $('vf-carga').value,
        'Prazo para se candidatar': $('vf-prazo').value, 'Descrição (o que a pessoa lê)': $('vf-desc').value, 'O que a pessoa vai fazer': $('vf-faz').value, 'Requisitos': $('vf-req').value,
        'Observações': $('vf-obs').value }], function (r) { b.disabled = false; if (!r.ok) return rhMsg('erro', r.erro); rhRecarregar('Vaga ' + r.id + ' salva. Ela aparece no Portal do RH em até 2 minutos.'); });
    };
    if ($('vf-del')) $('vf-del').onclick = function () {
      if (!confirm('Remover a vaga ' + v['ID'] + ' (' + v['Vaga'] + ')? Para só tirar do ar, use a situação Fechada.')) return;
      chamar('rhVagaRemover', [S.email, S.token, v.linha, v['ID']], function (r) { if (!r.ok) return rhMsg('erro', r.erro); rhRecarregar('Vaga removida (fica registrada no histórico do RH).'); });
    };
  }

   
  function rhPedidos() {
    var d = RH.d, c = $('rh-corpo');
    var fim = ['Finalizado c/Sucesso', 'Cancelado'];
    var l = d.pedidos.filter(function (p) { return RH.filtro === 'todos' || fim.indexOf(p.status) < 0; });
    c.innerHTML = '<div class="botoes"><select id="rp-f" style="max-width:220px"><option value="">Em aberto</option><option value="todos">Todos</option></select></div>' +
      (l.length ? l.map(function (p) {
        return '<details class="pend"><summary>' + esc(p.codigo) + ' · ' + esc(p.vaga || p.tipo) + ' · ' + esc(p.setor) + ' <span class="selo">' + esc(p.status || 'Não Iniciado') + '</span></summary>' +
          '<p style="font-size:13px"><b>' + esc(p.tipo) + '</b> · ' + esc(p.data) + (p.projeto ? ' · ' + esc(p.projeto) : '') + (p.qtd ? ' · ' + esc(p.qtd) + ' vaga(s)' : '') + (p.modalidade ? ' · ' + esc(p.modalidade) : '') +
          '<br>' + esc(p.resumo) + (p.atividades ? '<br><small>' + esc(p.atividades) + '</small>' : '') + '</p><div class="duas"><div>' +
          '<label>Situação</label><select id="rp-s-' + esc(p.codigo) + '">' + rhOpc(d.situacoesPedido, p.status || 'Não Iniciado') + '</select>' +
          '<label>Publicar em</label><select id="rp-p-' + esc(p.codigo) + '">' + rhOpc(d.publicar, p.publicar || 'Não publicar') + '</select></div><div>' +
          '<label>Área no Portal do RH</label><select id="rp-a-' + esc(p.codigo) + '">' + rhOpc(d.areas, p.area, 'Escolha') + '</select>' +
          '<label>Caminho</label><select id="rp-c-' + esc(p.codigo) + '">' + rhOpc(d.caminhos, p.caminho, 'Escolha') + '</select></div></div>' +
          rhIn('rp-n-' + p.codigo, 'Nota do RH', p.nota) + '<div class="botoes" style="margin-top:8px"><button class="btn pq" data-rp="' + esc(p.codigo) + '">Salvar</button></div></details>';
      }).join('') : '<p class="vazio">Nenhum pedido nesta lista.</p>');
    $('rp-f').value = RH.filtro;
    $('rp-f').onchange = function () { RH.filtro = this.value; rhPedidos(); };
    c.querySelectorAll('[data-rp]').forEach(function (b) { b.onclick = function () {
      var k = b.getAttribute('data-rp'); b.disabled = true;
      chamar('rhPedidoSalvar', [S.email, S.token, k, { status: $('rp-s-' + k).value, publicar: $('rp-p-' + k).value, area: $('rp-a-' + k).value, caminho: $('rp-c-' + k).value, nota: $('rp-n-' + k).value }],
        function (r) { b.disabled = false; if (!r.ok) return rhMsg('erro', r.erro); rhMsg('ok', 'Pedido ' + k + ' atualizado.'); });
    }; });
  }

   
  function rhCands() {
    var d = RH.d, c = $('rh-corpo');
    var abertas = ['Novo', 'Contato feito', 'Em andamento', 'Sala de espera'];
    var l = d.candidaturas.filter(function (x) { return (RH.filtro === 'todas' || abertas.indexOf(x.situacao) >= 0) && (!RH.busca || (x.nome + ' ' + x.email + ' ' + x.vaga).toLowerCase().indexOf(RH.busca) >= 0); });
    c.innerHTML = '<div class="botoes"><select id="rc-f" style="max-width:220px"><option value="">Em aberto</option><option value="todas">Todas</option></select>' +
      '<input type="text" id="rc-b" placeholder="Buscar nome, e-mail ou vaga" style="max-width:280px" value="' + esc(RH.busca) + '"></div>' +
      (l.length ? l.slice(0, 200).map(function (x) {
        return '<details class="pend"><summary>' + esc(x.nome) + ' · ' + esc(x.vaga) + ' <span class="selo">' + esc(x.situacao) + '</span></summary>' +
          '<p style="font-size:13px">' + esc(x.data) + ' · ' + esc(x.codigo) + (x.matricula ? ' · matrícula ' + esc(x.matricula) : '') + '<br>E-mail: ' + esc(x.email) + ' · WhatsApp: ' + esc(x.whatsapp) + ' · ' + esc(x.estado) +
          (x.menor === 'Sim' ? ' · <b>menor de idade</b>' : '') + '<br>Destino: ' + esc(x.destino) + '<br>Experiência: ' + esc(x.nivel) + ' · Turnos: ' + esc(x.turnos) + (x.viagem ? ' · Viagens: ' + esc(x.viagem) : '') +
          (x.detalhe ? '<br>' + esc(x.detalhe) : '') + '</p><div class="duas"><div><label>Situação</label><select id="rc-s-' + x.linha + '">' + rhOpc(d.situacoesCand, x.situacao) + '</select></div><div>' +
          rhIn('rc-o-' + x.linha, 'Observação interna', x.obs) + '</div></div><div class="botoes" style="margin-top:8px"><button class="btn pq claro" data-rcs="' + x.linha + '">Salvar situação</button>' +
          '<button class="btn pq" data-rco="' + x.linha + '">Agendar entrevista (onboarding)</button><button class="btn pq claro" data-rcc="' + x.linha + '">Aprovar e iniciar contratação direto</button></div></details>';
      }).join('') : '<p class="vazio">Nenhuma candidatura nesta lista.</p>') + '<div id="rc-form"></div>';
    $('rc-f').value = RH.filtro;
    $('rc-f').onchange = function () { RH.filtro = this.value; rhCands(); };
    $('rc-b').onchange = function () { RH.busca = this.value.toLowerCase().trim(); rhCands(); };
    var achar = function (n) { return d.candidaturas.filter(function (x) { return x.linha === n; })[0]; };
    c.querySelectorAll('[data-rcs]').forEach(function (b) { b.onclick = function () {

  function rhContrAcao(x, ac, b) {
    var sub = $('ra-sub'), fim = function (t) { return function (r) { if (b) b.disabled = false; if (!r.ok) return rhMsg('erro', r.erro); rhRecarregar(typeof t === 'function' ? t(r) : t); }; };

        (ad ? rhIn('re-fant', 'Função anterior', x.c42) + rhIn('re-pant', 'Projeto anterior', x.c43) + rhTx('re-obj', 'Objeto do adendo', x.c45) : rhIn('re-dias', 'Dias', x.c12) + rhIn('re-turnos', 'Turnos', x.c13)) +

        rhIn('re-cpf', 'CPF', x.c18) + rhIn('re-rua', 'Rua', x.c19) + rhIn('re-num', 'Número', x.c20) + rhIn('re-bai', 'Bairro', x.c21) + rhIn('re-cid', 'Cidade', x.c22) + rhIn('re-est', 'Estado', x.c23) + rhIn('re-cep', 'CEP', x.c24) +
        '</div></div>' + rhIn('re-obs', 'Observação interna', x.c40) + '<div class="botoes" style="margin-top:8px"><button class="btn" id="re-ok">Salvar</button></div>';
      $('re-ok').onclick = function () {
        var g = function (id) { return $(id) ? $(id).value : undefined; };
        chamar('rhContratoEditar', [S.email, S.token, x.c0, { projeto: g('re-proj'), funcao: g('re-func'), atividades: g('re-ativ'), dias: g('re-dias'), turnos: g('re-turnos'), funcaoAnterior: g('re-fant'),
          projetoAnterior: g('re-pant'), objeto: g('re-obj'), matricula: g('re-mat'), nacionalidade: g('re-nac'), profissao: g('re-prof'), rg: g('re-rg'), orgao: g('re-org'), cpf: g('re-cpf'), rua: g('re-rua'),
          numero: g('re-num'), bairro: g('re-bai'), cidade: g('re-cid'), estado: g('re-est'), cep: g('re-cep'), obs: g('re-obs') }], fim('Dados salvos.'));
      };
      return;

    if (ac === 'manual') {
      sub.innerHTML = '<div class="pend"><label>Data da assinatura</label><input type="text" id="rm-data" placeholder="dd/mm/aaaa"><label>Documento assinado (PDF)</label><input type="file" id="rm-arq" accept=".pdf,image/*"><label>ou link do documento assinado</label><input type="text" id="rm-link"><div class="botoes" style="margin-top:8px"><button class="btn pq" id="rm-ok">Registrar</button></div></div>';
      $('rm-ok').onclick = function () { haArq($('rm-arq')).then(function (arq) { chamar('rhAssinadoManual', [S.email, S.token, x.c0, { data: $('rm-data').value, link: $('rm-link').value, arquivo: arq }], fim('Assinatura registrada.')); }).catch(function (e) { rhMsg('erro', e.message); }); };
      return;

    var conf = { link: 'Reenviar o link de dados para ' + x.c6 + '?', autentique: 'Enviar o documento pelo Autentique para ' + x.c5 + (x.c25 === 'Sim' ? ', o responsável' : '') + ' e o MAP assinarem?',

    else if (ac === 'concluir') chamar('rhConcluir', [S.email, S.token, x.c0], fim(function (r) { return 'Concluído e registrado no Cadastro Único (matrícula ' + r.matricula + ').'; }));

  function rhProtecao() {

            .concat(p.leitores.map(function (e) { return '<tr><td>' + esc(e) + '</td><td>Vê</td><td><button class="btn pq claro" data-rpr="' + esc(p.id) + '|' + esc(e) + '|remover">Retirar</button></td></tr>'; }));
          return '<div class="pend"><b><a target="_blank" href="' + esc(p.url) + '">' + esc(p.nome) + '</a></b> <small>· link: ' + esc(p.link) + '</small>' +

        }).join('');
      c.querySelectorAll('[data-rpr]').forEach(function (b) { b.onclick = function () {
        var k = b.getAttribute('data-rpr').split('|');

        b.disabled = true;
        chamar('rhProtecaoAplicar', [S.email, S.token, k[0], k[1], k[2]], function (x) { if (!x.ok) { b.disabled = false; return rhMsg('erro', x.erro); } rhMsg('ok', 'Acesso alterado.'); rhProtecao(); });
      }; });

  }
</script>
<script>
   
  var ON = { alvo: '', d: null, aba: 'pessoas', filtro: '', busca: '', etapa: null };
  function onbTela(alvo) {
    ON.alvo = alvo || ON.alvo; var el = $(ON.alvo); if (!el) return;
    el.innerHTML = '<p class="carregando">Carregando o onboarding...</p>';
    chamar('onbDados', [S.email, S.token], function (r) {
      if (!r.ok) { el.innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      ON.d = r; onbDesenhar();

  }
  function onbMsg(t, x) { var m = $('on-msg'); if (m) { aviso(m, t, x); m.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }

  function onbOpc(l, sel, vazio) { return (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + l.map(function (x) { return '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); }

  function onbLista(id, l) { return '<datalist id="' + id + '">' + l.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>'; }
  var ON_ONDE = { Todos: 'Todo o MAP', Frente: 'Frente ou setor', Projeto: 'Projeto' };
  function onbOpcV(l, rot, sel) { return l.map(function (x) { return '<option value="' + esc(x) + '"' + (x === sel ? ' selected' : '') + '>' + esc(rot[x] || x) + '</option>'; }).join(''); }
  
  function onbMidia(l) {
    l = String(l || '').trim(); if (!/^https:\/\//.test(l)) return '';
    var y = /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/.exec(l), g = /drive\.google\.com\/file\/d\/([\w-]+)/.exec(l);
    var src = y ? 'https://www.youtube.com/embed/' + y[1] : g ? 'https://drive.google.com/file/d/' + g[1] + '/preview' : '';
    return (src ? '<div style="position:relative;padding-top:56.25%;margin:8px 0"><iframe src="' + esc(src) + '" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>' : '') +
      '<p><a class="btn pq claro" target="_blank" rel="noopener" href="' + esc(l) + '">Abrir ' + (src ? 'em outra aba' : 'o material') + '</a></p>';
  }
  function onbSel(sit) { return sit === 'Concluído' ? 'ok' : (['Não aprovada', 'Desistiu', 'Sala de espera'].indexOf(sit) >= 0 ? 'ruim' : (sit === 'Trilha' ? 'alerta' : '')); }

  function onbDesenhar() {
    var el = $(ON.alvo), d = ON.d;
    var abertos = d.lista.filter(function (x) { return d.fim.indexOf(x.c12) < 0; }).length;

      '<button class="btn ' + (ON.aba === 'pessoas' ? '' : 'claro') + '" data-onab="pessoas">Pessoas em integração (' + abertos + ')</button>' +
      '<button class="btn ' + (ON.aba === 'trilha' ? '' : 'claro') + '" data-onab="trilha">Conteúdo da trilha</button></div><div id="on-msg"></div><div id="on-corpo"></div></div>' +

    if (ON.aba === 'trilha') onbConteudo(); else onbPessoas();
  }

   
  function onbPessoas() {

    };
  }

   
  var OM = { d: null, etapa: null, resp: [] };
  function onbMinhaTela() {
    $('conteudo').innerHTML = '<p class="carregando">Carregando a sua trilha...</p>';
    chamar('onbMinha', [S.email, S.token], function (r) {
      if (!r.ok) { $('conteudo').innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      OM.d = r; onbMinhaDesenhar();
    });
  }
  function onbMinhaDesenhar() {
    var d = OM.d;
    var h = '<h1>Minha trilha de integração</h1><p class="sub-tit">' + esc(d.nome) + (d.funcao ? ' · ' + esc(d.funcao) : '') + (d.projeto ? ' · ' + esc(d.projeto) : '') + '</p><div id="om-msg"></div>';
    if (d.etapa === 'Concluído') h += '<div class="msg ok">Trilha concluída' + (d.nota ? ' com nota média ' + esc(d.nota) + '%' : '') + '. A coordenação do seu projeto já foi avisada.</div>';
    else h += '<div class="card"><p>Leia cada etapa com calma e faça o teste no final. Nota mínima: <b>' + d.notaMin + '%</b>. Se não atingir, você pode refazer ' + (d.tentativas - 1) + ' vez (relendo o conteúdo).' + (d.prazo ? ' Prazo: <b>' + esc(d.prazo) + '</b>.' : '') + '</p></div>';
    h += '<div class="grade">' + (d.lista.length ? d.lista.map(function (e, i) {
      var st = e.aprovada ? '<span class="selo ok">Aprovada · ' + e.nota + '%</span>' : e.esgotada ? '<span class="selo ruim">Tentativas esgotadas</span>' : e.aberta ? (e.tentativas ? '<span class="selo alerta">Refazer</span>' : '<span class="selo">Disponível</span>') : '<span class="selo">Bloqueada</span>';
      return '<div class="card"><h3>' + (i + 1) + '. ' + esc(e.titulo) + '</h3>' + st + '<p style="font-size:13px">Leitura mínima: ' + e.minutos + ' min</p>' +
        (e.aberta && !e.aprovada && !e.esgotada && d.etapa === 'Trilha' ? '<button class="btn" data-omab="' + esc(e.id) + '">' + (e.tentativas ? 'Reler e refazer' : 'Começar') + '</button>' : '') + '</div>';
    }).join('') : '<p class="vazio">Ainda não há etapas ativas para a sua função. O RH avisa quando estiverem prontas.</p>') + '</div><div id="om-etapa"></div>';
    $('conteudo').innerHTML = h;
    document.querySelectorAll('[data-omab]').forEach(function (b) { b.onclick = function () { onbMinhaAbrir(b.getAttribute('data-omab')); }; });
  }
  function onbMinhaAbrir(id) {
    var box = $('om-etapa'); box.innerHTML = '<p class="carregando">Abrindo a etapa...</p>';
    chamar('onbLer', [S.email, S.token, id], function (r) {
      if (!r.ok) { box.innerHTML = '<div class="msg erro">' + esc(r.erro) + '</div>'; return; }
      var e = r.etapa; OM.etapa = e; OM.inicio = Date.now();
      box.innerHTML = '<div class="card secao"><h2>' + esc(e.titulo) + '</h2>' + e.secoes.map(function (s) { return (s.titulo ? '<h3>' + esc(s.titulo) + '</h3>' : '') + (s.texto ? '<p style="white-space:pre-wrap">' + esc(s.texto) + '</p>' : '') + onbMidia(s.link); }).join('') +
        '<hr><h2>Teste</h2>' + e.perguntas.map(function (q, i) { return '<div style="margin:10px 0"><p><b>' + (i + 1) + '. ' + esc(q.pergunta) + '</b></p>' + q.opcoes.map(function (o, k) {
          return '<label class="tarefa" style="font-weight:normal;margin:2px 0"><input type="radio" name="om-q-' + i + '" value="' + 'ABCD'.charAt(k) + '"><span>' + esc(o) + '</span></label>'; }).join('') + '</div>'; }).join('') +
        '<div id="om-tempo" style="font-size:13px;color:var(--texto-suave)"></div><div class="botoes"><button class="btn" id="om-env">Enviar respostas</button></div><div id="om-res"></div></div>';
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var tick = function () { var falta = Math.max(0, e.minutos * 60 - Math.floor((Date.now() - OM.inicio) / 1000)); var t = $('om-tempo'); if (!t) return;
        t.textContent = falta ? 'Leia com calma: o teste pode ser enviado em ' + Math.ceil(falta / 60) + ' min.' : ''; if (falta) setTimeout(tick, 15000); };
      tick();
      $('om-env').onclick = function () {
        var resp = e.perguntas.map(function (q, i) { var x = document.querySelector('input[name="om-q-' + i + '"]:checked'); return x ? x.value : ''; });
        if (resp.some(function (x) { return !x; })) return aviso($('om-res'), 'erro', 'Responda todas as perguntas.');
        if (!confirm('Enviar as respostas desta etapa?')) return;
        var b = this; b.disabled = true;
        chamar('onbResponder', [S.email, S.token, e.id, resp], function (r) {
          b.disabled = false;
          if (!r.ok) return aviso($('om-res'), 'erro', r.erro);
          if (r.aprovada) { alert('Aprovada com ' + r.nota + '%!' + (r.fim === 'concluida' ? ' Você concluiu a trilha de integração.' : '')); return onbMinhaTela(); }
          if (r.fim === 'sala') { alert('Nota ' + r.nota + '%. Não foi desta vez: o RH vai falar com você sobre os próximos passos.'); return onbMinhaTela(); }
          alert('Nota ' + r.nota + '%. A nota mínima é ' + OM.d.notaMin + '%. Releia o conteúdo com calma: você pode refazer ' + r.restam + ' vez.'); onbMinhaTela();
        });
      };
    });
  }
</script>
